<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F7A7A"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D03 · B01-P04</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Qué es un sujeto sintético?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Una identidad ficticia que prueba los sistemas reales sin riesgo para ninguna persona</text>

  <!-- Fila superior: pasos 1-3 -->
  <g filter="url(#sh)">
    <rect x="90" y="200" rx="16" width="420" height="230" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="590" y="200" rx="16" width="420" height="230" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="1090" y="200" rx="16" width="420" height="230" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
  </g>
  <circle cx="140" cy="250" r="30" fill="#1F3864"/><text x="140" y="261" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">1</text>
  <circle cx="640" cy="250" r="30" fill="#1F3864"/><text x="640" y="261" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">2</text>
  <circle cx="1140" cy="250" r="30" fill="#1F3864"/><text x="1140" y="261" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">3</text>

  <text x="190" y="260" font-size="27" font-weight="bold" fill="#1F3864">Generación</text>
  <text x="120" y="310" font-size="22" fill="#41556F">ARGOS crea una identidad ficticia</text>
  <text x="120" y="340" font-size="22" fill="#41556F">con datos verosímiles que no</text>
  <text x="120" y="370" font-size="22" fill="#41556F">pertenecen a ninguna persona real.</text>
  <text x="120" y="408" font-size="21" font-style="italic" fill="#1F7A7A">Sin interesados = sin riesgo RGPD</text>

  <text x="690" y="260" font-size="27" font-weight="bold" fill="#1F3864">Introducción</text>
  <text x="620" y="310" font-size="22" fill="#41556F">Entra en los sistemas del cliente</text>
  <text x="620" y="340" font-size="22" fill="#41556F">por los canales habituales:</text>
  <text x="620" y="370" font-size="22" fill="#41556F">formularios, altas, aplicaciones.</text>
  <text x="620" y="408" font-size="21" font-style="italic" fill="#1F7A7A">Como lo haría un cliente real</text>

  <text x="1190" y="260" font-size="27" font-weight="bold" fill="#1F3864">Seguimiento</text>
  <text x="1120" y="310" font-size="22" fill="#41556F">ARGOS rastrea su propagación:</text>
  <text x="1120" y="340" font-size="22" fill="#41556F">dónde se copia, quién puede leerlo,</text>
  <text x="1120" y="370" font-size="22" fill="#41556F">a qué sistemas y terceros viaja.</text>
  <text x="1120" y="408" font-size="21" font-style="italic" fill="#1F7A7A">El mapa real del dato</text>

  <!-- Fila inferior: pasos 4-6 (derecha a izquierda) -->
  <g filter="url(#sh)">
    <rect x="1090" y="560" rx="16" width="420" height="230" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="590" y="560" rx="16" width="420" height="230" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="90" y="560" rx="16" width="420" height="230" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
  </g>
  <circle cx="1140" cy="610" r="30" fill="#1F7A7A"/><text x="1140" y="621" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">4</text>
  <circle cx="640" cy="610" r="30" fill="#1F7A7A"/><text x="640" y="621" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">5</text>
  <circle cx="140" cy="610" r="30" fill="#1F7A7A"/><text x="140" y="621" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">6</text>

  <text x="1190" y="620" font-size="27" font-weight="bold" fill="#1F7A7A">Ejercicio de derechos</text>
  <text x="1120" y="670" font-size="22" fill="#41556F">Solicita el acceso o la supresión</text>
  <text x="1120" y="700" font-size="22" fill="#41556F">del sujeto por el canal oficial</text>
  <text x="1120" y="730" font-size="22" fill="#41556F">y mide el circuito completo.</text>
  <text x="1120" y="768" font-size="21" font-style="italic" fill="#1F3864">Contra el plazo legal de 1 mes</text>

  <text x="690" y="620" font-size="27" font-weight="bold" fill="#1F7A7A">Verificación de borrado</text>
  <text x="620" y="670" font-size="22" fill="#41556F">Reinspecciona cada repositorio</text>
  <text x="620" y="700" font-size="22" fill="#41556F">donde apareció: primarios, réplicas,</text>
  <text x="620" y="730" font-size="22" fill="#41556F">índices, exportaciones y copias.</text>
  <text x="620" y="768" font-size="21" font-style="italic" fill="#1F3864">Si persiste → hallazgo con evidencia</text>

  <text x="190" y="620" font-size="27" font-weight="bold" fill="#1F7A7A">Eliminación verificada</text>
  <text x="120" y="670" font-size="22" fill="#41556F">Al cerrar la campaña, ARGOS</text>
  <text x="120" y="700" font-size="22" fill="#41556F">elimina el sujeto y verifica su</text>
  <text x="120" y="730" font-size="22" fill="#41556F">propio borrado con sus sondas.</text>
  <text x="120" y="768" font-size="21" font-style="italic" fill="#1F3864">El mismo estándar que exige</text>

  <!-- Flechas del ciclo -->
  <g fill="none" stroke="#1F7A7A" stroke-width="5">
    <line x1="510" y1="315" x2="580" y2="315" marker-end="url(#arw)"/>
    <line x1="1010" y1="315" x2="1080" y2="315" marker-end="url(#arw)"/>
    <path d="M1300 430 L1300 550" marker-end="url(#arw)"/>
    <line x1="1090" y1="675" x2="1020" y2="675" marker-end="url(#arw)"/>
    <line x1="590" y1="675" x2="520" y2="675" marker-end="url(#arw)"/>
  </g>

  <rect x="80" y="850" rx="14" width="1440" height="90" fill="#1F3864"/>
  <rect x="80" y="850" rx="14" width="14" height="90" fill="#C9A227"/>
  <text x="800" y="890" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">Pruebas con comportamiento real, riesgo cero para las personas</text>
  <text x="800" y="924" text-anchor="middle" font-size="22" fill="#CFE0F5">Todo el ciclo queda registrado en la cadena de evidencias con sello temporal y huella criptográfica.</text>
  <text x="1560" y="985" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
