<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F7A7A"/>
    </marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/>
    </marker>
    <marker id="arwgn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2E8B57"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D15 · B11-P07</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Verifica ARGOS que una remediación se ha aplicado de verdad?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Sí: un hallazgo solo se cierra cuando la sonda vuelve a dar conforme</text>

  <!-- Flujo principal -->
  <g filter="url(#sh)">
    <rect x="90" y="220" rx="16" width="330" height="150" fill="#FBEAEA" stroke="#C0392B" stroke-width="2.5"/>
    <rect x="510" y="220" rx="16" width="330" height="150" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="930" y="220" rx="16" width="330" height="150" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="560" y="470" rx="16" width="330" height="150" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
  </g>

  <text x="255" y="268" text-anchor="middle" font-size="25" font-weight="bold" fill="#C0392B">1 · Hallazgo</text>
  <text x="255" y="305" text-anchor="middle" font-size="20" fill="#7A3A32">veredicto no conforme</text>
  <text x="255" y="332" text-anchor="middle" font-size="20" fill="#7A3A32">con evidencia y regla</text>

  <text x="675" y="268" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F3864">2 · Remediación</text>
  <text x="675" y="305" text-anchor="middle" font-size="20" fill="#41556F">ticket al equipo; se corrige</text>
  <text x="675" y="332" text-anchor="middle" font-size="20" fill="#41556F">la causa raíz</text>

  <text x="1095" y="268" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F3864">3 · Marcado «remediado»</text>
  <text x="1095" y="305" text-anchor="middle" font-size="20" fill="#41556F">el equipo declara</text>
  <text x="1095" y="332" text-anchor="middle" font-size="20" fill="#41556F">el arreglo aplicado</text>

  <text x="725" y="518" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F7A7A">4 · Re-ejecución de sondas</text>
  <text x="725" y="555" text-anchor="middle" font-size="20" fill="#41556F">ARGOS repite exactamente</text>
  <text x="725" y="582" text-anchor="middle" font-size="20" fill="#41556F">las pruebas del hallazgo</text>

  <g fill="none" stroke="#1F7A7A" stroke-width="6">
    <line x1="420" y1="295" x2="498" y2="295" marker-end="url(#arw)"/>
    <line x1="840" y1="295" x2="918" y2="295" marker-end="url(#arw)"/>
    <path d="M1095 370 Q 1095 545 900 545" marker-end="url(#arw)"/>
  </g>

  <!-- Decisión -->
  <g filter="url(#sh)"><polygon points="250,545 370,470 490,545 370,620" fill="#FBF6E2" stroke="#C9A227" stroke-width="3"/></g>
  <text x="370" y="537" text-anchor="middle" font-size="23" font-weight="bold" fill="#8A6D12">¿Veredicto</text>
  <text x="370" y="567" text-anchor="middle" font-size="23" font-weight="bold" fill="#8A6D12">conforme?</text>
  <line x1="556" y1="545" x2="502" y2="545" stroke="#1F7A7A" stroke-width="6" marker-end="url(#arw)"/>

  <!-- Ramas -->
  <g filter="url(#sh)">
    <rect x="120" y="700" rx="16" width="560" height="150" fill="#EAF6EF" stroke="#2E8B57" stroke-width="3"/>
    <rect x="880" y="700" rx="16" width="560" height="150" fill="#FBEAEA" stroke="#C0392B" stroke-width="3"/>
  </g>
  <line x1="370" y1="622" x2="370" y2="690" stroke="#2E8B57" stroke-width="6" marker-end="url(#arwgn)"/>
  <text x="392" y="665" font-size="21" font-weight="bold" fill="#2E8B57">SÍ</text>
  <path d="M448 588 C 640 685, 900 660, 1058 694" fill="none" stroke="#C0392B" stroke-width="6" marker-end="url(#arwr)"/>
  <text x="760" y="650" font-size="21" font-weight="bold" fill="#C0392B">NO</text>

  <circle cx="205" cy="775" r="36" fill="#2E8B57"/>
  <path d="M188 775 l12 12 l25 -27" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="265" y="762" font-size="25" font-weight="bold" fill="#2E8B57">Hallazgo CERRADO</text>
  <text x="265" y="800" font-size="20" fill="#3B5A48">con la evidencia del antes y el después</text>
  <text x="265" y="828" font-size="20" fill="#3B5A48">en la cadena criptográfica</text>

  <circle cx="965" cy="775" r="36" fill="#C0392B"/>
  <path d="M950 760 l30 30 M980 760 l-30 30" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <text x="1025" y="762" font-size="25" font-weight="bold" fill="#C0392B">Hallazgo sigue ABIERTO</text>
  <text x="1025" y="800" font-size="20" fill="#7A3A32">la corrección declarada no funcionó:</text>
  <text x="1025" y="828" font-size="20" fill="#7A3A32">vuelve al plan de remediación</text>

  <!-- Banda inferior -->
  <g filter="url(#sh)"><rect x="80" y="890" rx="14" width="1440" height="60" fill="#1F3864"/></g>
  <text x="800" y="930" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF">La remediación declarada se trata con el mismo escepticismo que el cumplimiento declarado</text>

  <text x="1560" y="985" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
