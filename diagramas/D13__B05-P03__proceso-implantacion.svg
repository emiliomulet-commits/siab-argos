<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F7A7A"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D13 · B05-P03</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Cómo es el proceso de implantación?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Cinco fases ordenadas, con valor visible desde la primera</text>

  <!-- Línea de proceso -->
  <line x1="140" y1="330" x2="1480" y2="330" stroke="#B8C4D8" stroke-width="8"/>

  <!-- Fases -->
  <g filter="url(#sh)">
    <circle cx="200" cy="330" r="46" fill="#1F7A7A"/>
    <circle cx="500" cy="330" r="46" fill="#1F7A7A"/>
    <circle cx="800" cy="330" r="46" fill="#1F3864"/>
    <circle cx="1100" cy="330" r="46" fill="#1F3864"/>
    <circle cx="1400" cy="330" r="46" fill="#C9A227"/>
  </g>
  <g text-anchor="middle" font-size="36" font-weight="bold" fill="#FFFFFF">
    <text x="200" y="343">1</text><text x="500" y="343">2</text><text x="800" y="343">3</text><text x="1100" y="343">4</text><text x="1400" y="343" fill="#1F3864">5</text>
  </g>

  <!-- Tarjetas alternadas -->
  <g filter="url(#sh)">
    <rect x="90" y="160" rx="14" width="240" height="120" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="390" y="400" rx="14" width="240" height="130" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="690" y="160" rx="14" width="240" height="120" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="990" y="400" rx="14" width="240" height="130" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="1280" y="160" rx="14" width="250" height="120" fill="#FBF6E2" stroke="#C9A227" stroke-width="2.5"/>
  </g>
  <g text-anchor="middle">
    <text x="210" y="200" font-size="23" font-weight="bold" fill="#1F7A7A">Instalación</text>
    <text x="210" y="232" font-size="19" fill="#41556F">appliance + alta de</text>
    <text x="210" y="257" font-size="19" fill="#41556F">conectores solo lectura</text>

    <text x="510" y="442" font-size="23" font-weight="bold" fill="#1F7A7A">Inventario</text>
    <text x="510" y="474" font-size="19" fill="#41556F">censo inicial de</text>
    <text x="510" y="499" font-size="19" fill="#41556F">sistemas del alcance</text>

    <text x="810" y="200" font-size="23" font-weight="bold" fill="#1F3864">Clasificación</text>
    <text x="810" y="232" font-size="19" fill="#41556F">datos personales +</text>
    <text x="810" y="257" font-size="19" fill="#41556F">grafo de lineaje</text>

    <text x="1110" y="442" font-size="23" font-weight="bold" fill="#1F3864">Contraste</text>
    <text x="1110" y="474" font-size="19" fill="#41556F">RoPA declarado vs.</text>
    <text x="1110" y="499" font-size="19" fill="#41556F">realidad técnica</text>

    <text x="1405" y="200" font-size="23" font-weight="bold" fill="#8A6D12">Campañas de reto</text>
    <text x="1405" y="232" font-size="19" fill="#41556F">sondas activas sobre</text>
    <text x="1405" y="257" font-size="19" fill="#41556F">controles priorizados</text>
  </g>
  <g stroke="#9AA7BB" stroke-width="3">
    <line x1="200" y1="284" x2="200" y2="280"/><line x1="210" y1="280" x2="210" y2="284"/>
  </g>

  <!-- Marcador de valor temprano -->
  <g filter="url(#sh)"><rect x="140" y="590" rx="16" width="1320" height="140" fill="#EAF6EF" stroke="#2E8B57" stroke-width="3"/></g>
  <circle cx="220" cy="660" r="40" fill="#2E8B57"/>
  <path d="M202 660 l13 13 l26 -28" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="290" y="645" font-size="26" font-weight="bold" fill="#2E8B57">Valor desde la fase 2-4, antes de la primera campaña de retos</text>
  <text x="290" y="690" font-size="22" fill="#3B5A48">El inventario completo y el RoPA diferencial ya afloran sistemas fuera de gobierno,</text>
  <text x="290" y="720" font-size="22" fill="#3B5A48">tratamientos no declarados y flujos sin cobertura contractual.</text>

  <!-- Requisitos del cliente -->
  <g filter="url(#sh)"><rect x="140" y="770" rx="16" width="1320" height="140" fill="#1F3864"/></g>
  <rect x="140" y="770" rx="16" width="14" height="140" fill="#C9A227"/>
  <text x="800" y="820" text-anchor="middle" font-size="25" font-weight="bold" fill="#FFFFFF">Qué necesita ARGOS de su equipo</text>
  <text x="800" y="860" text-anchor="middle" font-size="22" fill="#CFE0F5">Un interlocutor de sistemas (alta de conectores, credenciales de solo lectura) y un responsable</text>
  <text x="800" y="890" text-anchor="middle" font-size="22" fill="#CFE0F5">de cumplimiento —habitualmente el DPO— que revise hallazgos y priorice remediaciones.</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
