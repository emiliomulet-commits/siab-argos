<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F7A7A"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D09 · B03-P08</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Cómo verifica ARGOS que un borrado se ha producido realmente?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">La sonda de borrado efectivo, paso a paso</text>

  <!-- Pasos superiores -->
  <g filter="url(#sh)">
    <rect x="80" y="180" rx="16" width="440" height="130" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="580" y="180" rx="16" width="440" height="130" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="1080" y="180" rx="16" width="440" height="130" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
  </g>
  <circle cx="128" cy="228" r="26" fill="#1F3864"/><text x="128" y="238" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="172" y="236" font-size="25" font-weight="bold" fill="#1F3864">Solicitud de supresión</text>
  <text x="110" y="278" font-size="21" fill="#41556F">Sobre un sujeto sintético, por el canal oficial</text>

  <circle cx="628" cy="228" r="26" fill="#1F3864"/><text x="628" y="238" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="672" y="236" font-size="25" font-weight="bold" fill="#1F3864">Espera del plazo</text>
  <text x="610" y="278" font-size="21" fill="#41556F">ARGOS respeta el plazo real de atención (≤ 1 mes)</text>

  <circle cx="1128" cy="228" r="26" fill="#1F3864"/><text x="1128" y="238" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="1172" y="236" font-size="25" font-weight="bold" fill="#1F3864">Reinspección total</text>
  <text x="1110" y="278" font-size="21" fill="#41556F">Vuelve a todos los repositorios donde apareció</text>

  <g fill="none" stroke="#1F7A7A" stroke-width="6">
    <line x1="520" y1="245" x2="568" y2="245" marker-end="url(#arw)"/>
    <line x1="1020" y1="245" x2="1068" y2="245" marker-end="url(#arw)"/>
  </g>

  <!-- Repositorios inspeccionados -->
  <text x="800" y="375" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">Dónde mira ARGOS (nada se da por borrado sin comprobarlo)</text>
  <g filter="url(#sh)">
    <rect x="105" y="400" rx="14" width="260" height="120" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="387" y="400" rx="14" width="260" height="120" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="669" y="400" rx="14" width="260" height="120" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="951" y="400" rx="14" width="260" height="120" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="1233" y="400" rx="14" width="260" height="120" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="23" font-weight="bold" fill="#1F7A7A">
    <text x="235" y="450">Base de datos</text><text x="235" y="480">primaria</text>
    <text x="517" y="450">Réplicas y</text><text x="517" y="480">respaldos activos</text>
    <text x="799" y="450">Índices de</text><text x="799" y="480">búsqueda</text>
    <text x="1081" y="450">Exportaciones</text><text x="1081" y="480">y ficheros</text>
    <text x="1363" y="450">Copias de</text><text x="1363" y="480">trabajo</text>
  </g>

  <!-- Bifurcación de veredicto -->
  <line x1="800" y1="530" x2="800" y2="580" stroke="#1F7A7A" stroke-width="6" marker-end="url(#arw)"/>
  <g filter="url(#sh)">
    <rect x="170" y="600" rx="16" width="580" height="200" fill="#EAF6EF" stroke="#2E8B57" stroke-width="3"/>
    <rect x="850" y="600" rx="16" width="580" height="200" fill="#FBEAEA" stroke="#C0392B" stroke-width="3"/>
  </g>
  <circle cx="245" cy="665" r="34" fill="#2E8B57"/>
  <path d="M228 665 l12 12 l24 -26" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="662" font-size="27" font-weight="bold" fill="#2E8B57">El dato ya no existe en ninguno</text>
  <text x="300" y="700" font-size="27" font-weight="bold" fill="#2E8B57">→ VEREDICTO CONFORME</text>
  <text x="205" y="755" font-size="21" fill="#3B5A48">Evidencia positiva de cada repositorio, con sello temporal</text>

  <circle cx="925" cy="665" r="34" fill="#C0392B"/>
  <path d="M910 650 l30 30 M940 650 l-30 30" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <text x="980" y="662" font-size="27" font-weight="bold" fill="#C0392B">El dato persiste en alguno</text>
  <text x="980" y="700" font-size="27" font-weight="bold" fill="#C0392B">→ HALLAZGO NO CONFORME</text>
  <text x="885" y="755" font-size="21" fill="#7A3A32">Con la evidencia exacta de dónde sigue existiendo el dato</text>

  <!-- Banda inferior -->
  <g filter="url(#sh)"><rect x="80" y="840" rx="16" width="1440" height="90" fill="#1F3864"/></g>
  <rect x="80" y="840" rx="16" width="14" height="90" fill="#C9A227"/>
  <text x="800" y="878" text-anchor="middle" font-size="25" font-weight="bold" fill="#FFFFFF">«Borrado» declarado ≠ borrado real: ARGOS solo acepta lo que puede comprobar</text>
  <text x="800" y="912" text-anchor="middle" font-size="21" fill="#CFE0F5">La misma sonda re-verifica después la remediación antes de cerrar el hallazgo.</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
