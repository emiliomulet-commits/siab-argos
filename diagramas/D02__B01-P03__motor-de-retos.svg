<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#2A4E8A"/><stop offset="1" stop-color="#1F3864"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D02 · B01-P03</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Qué significa que ARGOS «reta» a los sistemas?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Siete familias de sondas activas: verificación por comportamiento, no por declaración</text>

  <!-- Radios -->
  <g stroke="#B8C4D8" stroke-width="3">
    <line x1="800" y1="565" x2="800" y2="255"/>
    <line x1="800" y1="565" x2="1156" y2="392"/>
    <line x1="800" y1="565" x2="1245" y2="640"/>
    <line x1="800" y1="565" x2="998" y2="850"/>
    <line x1="800" y1="565" x2="602" y2="850"/>
    <line x1="800" y1="565" x2="355" y2="640"/>
    <line x1="800" y1="565" x2="444" y2="392"/>
  </g>

  <!-- Núcleo -->
  <g filter="url(#sh)"><circle cx="800" cy="565" r="135" fill="url(#core)"/></g>
  <circle cx="800" cy="565" r="135" fill="none" stroke="#C9A227" stroke-width="5"/>
  <text x="800" y="545" text-anchor="middle" font-size="34" font-weight="bold" fill="#FFFFFF">MOTOR</text>
  <text x="800" y="585" text-anchor="middle" font-size="34" font-weight="bold" fill="#FFFFFF">DE RETOS</text>
  <text x="800" y="622" text-anchor="middle" font-size="21" fill="#CFE0F5">pruebas activas ARGOS</text>

  <!-- Sondas (7 nodos) -->
  <g filter="url(#sh)">
    <rect x="640" y="180" rx="14" width="320" height="96" fill="#1F7A7A"/>
    <rect x="1060" y="330" rx="14" width="330" height="96" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="1130" y="595" rx="14" width="330" height="96" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="880" y="805" rx="14" width="330" height="96" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="390" y="805" rx="14" width="330" height="96" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="140" y="595" rx="14" width="330" height="96" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="210" y="330" rx="14" width="330" height="96" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
  </g>

  <g text-anchor="middle">
    <text x="800" y="222" font-size="25" font-weight="bold" fill="#FFFFFF">1 · Sujetos sintéticos</text>
    <text x="800" y="253" font-size="20" fill="#DFF0F0">introduce identidades ficticias y las rastrea</text>

    <text x="1225" y="372" font-size="25" font-weight="bold" fill="#1F3864">2 · Derechos de prueba</text>
    <text x="1225" y="403" font-size="20" fill="#41556F">ejercita acceso y supresión y mide el circuito</text>

    <text x="1295" y="637" font-size="25" font-weight="bold" fill="#1F3864">3 · Borrado efectivo</text>
    <text x="1295" y="668" font-size="20" fill="#41556F">comprueba que el dato ya no existe</text>

    <text x="1045" y="847" font-size="25" font-weight="bold" fill="#1F3864">4 · Retención</text>
    <text x="1045" y="878" font-size="20" fill="#41556F">contrasta plazos declarados vs. reales</text>

    <text x="555" y="847" font-size="25" font-weight="bold" fill="#1F3864">5 · Cifrado y accesos</text>
    <text x="555" y="878" font-size="20" fill="#41556F">verifica que los controles funcionan</text>

    <text x="305" y="637" font-size="25" font-weight="bold" fill="#1F3864">6 · Flujos y lineaje</text>
    <text x="305" y="668" font-size="20" fill="#41556F">detecta cesiones y salidas del EEE</text>

    <text x="375" y="372" font-size="25" font-weight="bold" fill="#1F3864">7 · Trazabilidad</text>
    <text x="375" y="403" font-size="20" fill="#41556F">registros de eventos completos y fiables</text>
  </g>

  <!-- Cinta inferior -->
  <rect x="80" y="935" rx="12" width="1440" height="2" fill="#C9A227"/>
  <text x="800" y="970" text-anchor="middle" font-size="23" font-style="italic" fill="#1F3864">Cada sonda produce evidencias con sello temporal que alimentan el motor de evaluación determinista.</text>
  <text x="1560" y="998" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
