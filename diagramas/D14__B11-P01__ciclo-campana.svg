<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F7A7A"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D14 · B11-P01</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Qué es una campaña de verificación?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">La unidad operativa de ARGOS: un ciclo reproducible y comparable</text>

  <!-- Núcleo -->
  <g filter="url(#sh)"><circle cx="700" cy="545" r="150" fill="#1F3864"/></g>
  <circle cx="700" cy="545" r="150" fill="none" stroke="#C9A227" stroke-width="5"/>
  <text x="700" y="520" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">CAMPAÑA</text>
  <text x="700" y="558" text-anchor="middle" font-size="20" fill="#CFE0F5">registrada con: alcance,</text>
  <text x="700" y="585" text-anchor="middle" font-size="20" fill="#CFE0F5">versión del catálogo,</text>
  <text x="700" y="612" text-anchor="middle" font-size="20" fill="#CFE0F5">sondas y resultados</text>

  <!-- Nodos del ciclo (5 en anillo) -->
  <g filter="url(#sh)">
    <rect x="540" y="185" rx="14" width="320" height="100" fill="#1F7A7A"/>
    <rect x="1030" y="380" rx="14" width="330" height="100" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="960" y="700" rx="14" width="330" height="100" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="290" y="700" rx="14" width="330" height="100" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="90" y="380" rx="14" width="330" height="100" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
  </g>
  <g text-anchor="middle">
    <text x="700" y="228" font-size="24" font-weight="bold" fill="#FFFFFF">1 · Definir alcance</text>
    <text x="700" y="260" font-size="19" fill="#DFF0F0">sistemas, dominios y perfil normativo</text>

    <text x="1195" y="423" font-size="24" font-weight="bold" fill="#1F3864">2 · Ejecutar sondas</text>
    <text x="1195" y="455" font-size="19" fill="#41556F">en ventanas y con límites por sistema</text>

    <text x="1125" y="743" font-size="24" font-weight="bold" fill="#1F3864">3 · Recoger evidencias</text>
    <text x="1125" y="775" font-size="19" fill="#41556F">selladas en la cadena criptográfica</text>

    <text x="455" y="743" font-size="24" font-weight="bold" fill="#1F3864">4 · Emitir veredictos</text>
    <text x="455" y="775" font-size="19" fill="#41556F">motor determinista, regla por regla</text>

    <text x="255" y="423" font-size="24" font-weight="bold" fill="#1F3864">5 · Informar y remediar</text>
    <text x="255" y="455" font-size="19" fill="#41556F">informe, credencial y plan priorizado</text>
  </g>

  <!-- Flechas del ciclo -->
  <g fill="none" stroke="#1F7A7A" stroke-width="6">
    <path d="M880 250 Q 1120 280 1180 370" marker-end="url(#arw)"/>
    <path d="M1210 490 Q 1220 620 1170 692" marker-end="url(#arw)"/>
    <path d="M950 755 L 630 755" marker-end="url(#arw)"/>
    <path d="M400 692 Q 330 620 300 490" marker-end="url(#arw)"/>
    <path d="M300 370 Q 360 275 528 240" marker-end="url(#arw)"/>
  </g>

  <!-- Modos de lanzamiento -->
  <g filter="url(#sh)"><rect x="1180" y="150" rx="14" width="340" height="180" fill="#FBF6E2" stroke="#C9A227" stroke-width="2.5"/></g>
  <text x="1350" y="192" text-anchor="middle" font-size="22" font-weight="bold" fill="#8A6D12">Tres modos de lanzarla</text>
  <g font-size="20" fill="#3A3113">
    <text x="1210" y="232">▪  Recurrente (controles críticos)</text>
    <text x="1210" y="268">▪  Bajo demanda (auditoría, cambio)</text>
    <text x="1210" y="304">▪  Delta (nueva versión del catálogo)</text>
  </g>

  <!-- Banda inferior -->
  <g filter="url(#sh)"><rect x="80" y="855" rx="16" width="1440" height="80" fill="#1F3864"/></g>
  <rect x="80" y="855" rx="16" width="14" height="80" fill="#C9A227"/>
  <text x="800" y="905" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF">Cada campaña es comparable con las anteriores: el cumplimiento se convierte en una serie temporal gestionable</text>

  <text x="1560" y="985" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
