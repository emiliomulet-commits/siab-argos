<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D05 · B01-P10</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Por qué es urgente una herramienta así ahora?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Sanciones crecientes + calendario regulatorio con fechas exigibles</text>

  <!-- Panel sanciones -->
  <g filter="url(#sh)"><rect x="80" y="180" rx="18" width="620" height="330" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/></g>
  <text x="390" y="230" text-anchor="middle" font-size="27" font-weight="bold" fill="#1F3864">Sanciones RGPD acumuladas en la UE</text>
  <!-- Barras crecientes -->
  <g fill="#1F7A7A">
    <rect x="340" y="420" width="48" height="40"/>
    <rect x="400" y="400" width="48" height="60"/>
    <rect x="460" y="375" width="48" height="85"/>
    <rect x="520" y="340" width="48" height="120"/>
    <rect x="580" y="300" width="48" height="160"/>
    <rect x="640" y="255" width="48" height="205" fill="#C0392B"/>
  </g>
  <g font-size="18" fill="#41556F" text-anchor="middle">
    <text x="364" y="485">2019</text><text x="424" y="485">2020</text><text x="484" y="485">2021</text>
    <text x="544" y="485">2022</text><text x="604" y="485">2023</text><text x="664" y="485">2024+</text>
  </g>
  
  <text x="115" y="300" font-size="42" font-weight="bold" fill="#C0392B">&gt; 5.880 M€</text><text x="115" y="338" font-size="25" fill="#8E3A30">en sanciones desde 2018</text>
  <text x="115" y="372" font-size="21" fill="#8E3A30">1.200 M€ solo en 2024</text>

  <!-- Panel mensaje -->
  <g filter="url(#sh)"><rect x="740" y="180" rx="18" width="780" height="330" fill="#1F3864"/></g>
  <rect x="740" y="180" rx="18" width="14" height="330" fill="#C9A227"/>
  <text x="790" y="245" font-size="28" font-weight="bold" fill="#FFFFFF">Tres fuerzas convergen</text>
  <g font-size="23" fill="#CFE0F5">
    <text x="790" y="300">1 ·  La presión sancionadora crece año a año</text>
    <text x="790" y="345">2 ·  Dos reglamentos con fechas duras entran en juego:</text>
    <text x="830" y="380">el Reglamento de IA y el EHDS</text>
    <text x="790" y="425">3 ·  Ninguna herramienta verifica hoy el paquete</text>
    <text x="830" y="460">europeo completo sobre los sistemas reales</text>
  </g>

  <!-- Línea temporal -->
  <g filter="url(#sh)"><rect x="80" y="560" rx="18" width="1440" height="330" fill="#FFFFFF" stroke="#B8C4D8" stroke-width="2"/></g>
  <line x1="150" y1="730" x2="1460" y2="730" stroke="#1F3864" stroke-width="6"/>
  <polygon points="1460,730 1440,720 1440,740" fill="#1F3864"/>

  <!-- Hitos -->
  <g>
    <circle cx="230" cy="730" r="14" fill="#1F7A7A"/>
    <text x="230" y="690" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">2018</text>
    <text x="230" y="775" text-anchor="middle" font-size="20" fill="#41556F">RGPD aplicable:</text>
    <text x="230" y="800" text-anchor="middle" font-size="20" fill="#41556F">empieza el ciclo</text>
    <text x="230" y="825" text-anchor="middle" font-size="20" fill="#41556F">sancionador</text>

    <circle cx="530" cy="730" r="14" fill="#1F7A7A"/>
    <text x="530" y="690" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">mar 2025</text>
    <text x="530" y="775" text-anchor="middle" font-size="20" fill="#41556F">EHDS en vigor</text>
    <text x="530" y="800" text-anchor="middle" font-size="20" fill="#41556F">(Regl. 2025/327)</text>

    <circle cx="820" cy="730" r="17" fill="#C0392B"/>
    <text x="820" y="660" text-anchor="middle" font-size="24" font-weight="bold" fill="#C0392B">2 ago 2026</text>
    <text x="820" y="690" text-anchor="middle" font-size="20" font-weight="bold" fill="#C0392B">YA APLICABLE</text>
    <text x="820" y="775" text-anchor="middle" font-size="20" fill="#41556F">Reglamento de IA:</text>
    <text x="820" y="800" text-anchor="middle" font-size="20" fill="#41556F">aplicación general;</text>
    <text x="820" y="825" text-anchor="middle" font-size="20" fill="#41556F">alto riesgo: 2 dic 2027</text>

    <circle cx="1130" cy="730" r="17" fill="#C9A227"/>
    <text x="1130" y="690" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">26 mar 2027</text>
    <text x="1130" y="775" text-anchor="middle" font-size="20" fill="#41556F">EHDS: aplicación</text>
    <text x="1130" y="800" text-anchor="middle" font-size="20" fill="#41556F">general en salud</text>

    <circle cx="1390" cy="730" r="14" fill="#1F7A7A"/>
    <text x="1390" y="690" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">2035</text>
    <text x="1390" y="775" text-anchor="middle" font-size="20" fill="#41556F">EHDS: obligaciones</text>
    <text x="1390" y="800" text-anchor="middle" font-size="20" fill="#41556F">escalonadas completas</text>
  </g>

  <!-- Marcador HOY -->
  <line x1="905" y1="615" x2="905" y2="860" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="868" y="580" rx="10" width="80" height="36" fill="#C0392B"/>
  <text x="908" y="605" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">HOY</text>

  <text x="800" y="945" text-anchor="middle" font-size="23" font-style="italic" fill="#1F3864">El calendario no espera: verificar antes de que verifiquen.</text>
  <text x="1560" y="985" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
