<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1F3864" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D06 · B03-P01</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Cómo está estructurada la arquitectura de ARGOS?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Siete capas funcionales, de la evidencia (base) a los informes (cima)</text>

  <!-- Capas: de C6 arriba a C0 abajo -->
  <g filter="url(#sh)">
    <rect x="200" y="165" rx="12" width="1200" height="86" fill="#1F3864"/>
    <rect x="200" y="263" rx="12" width="1200" height="86" fill="#26437A"/>
    <rect x="200" y="361" rx="12" width="1200" height="86" fill="#1F7A7A"/>
    <rect x="200" y="459" rx="12" width="1200" height="86" fill="#2E8F8F"/>
    <rect x="200" y="557" rx="12" width="1200" height="86" fill="#4FA3A3"/>
    <rect x="200" y="655" rx="12" width="1200" height="86" fill="#7A93B8"/>
    <rect x="200" y="753" rx="12" width="1200" height="86" fill="#C9A227"/>
  </g>

  <!-- Chips de capa -->
  <g text-anchor="middle" font-size="26" font-weight="bold">
    <circle cx="262" cy="208" r="30" fill="#FFFFFF"/><text x="262" y="218" fill="#1F3864">C6</text>
    <circle cx="262" cy="306" r="30" fill="#FFFFFF"/><text x="262" y="316" fill="#26437A">C5</text>
    <circle cx="262" cy="404" r="30" fill="#FFFFFF"/><text x="262" y="414" fill="#1F7A7A">C4</text>
    <circle cx="262" cy="502" r="30" fill="#FFFFFF"/><text x="262" y="512" fill="#2E8F8F">C3</text>
    <circle cx="262" cy="600" r="30" fill="#FFFFFF"/><text x="262" y="610" fill="#4FA3A3">C2</text>
    <circle cx="262" cy="698" r="30" fill="#FFFFFF"/><text x="262" y="708" fill="#7A93B8">C1</text>
    <circle cx="262" cy="796" r="30" fill="#1F3864"/><text x="262" y="806" fill="#C9A227">C0</text>
  </g>

  <!-- Nombres y descripciones -->
  <g font-size="27" font-weight="bold" fill="#FFFFFF">
    <text x="320" y="200">Informes y remediación</text>
    <text x="320" y="298">Motor de evaluación</text>
    <text x="320" y="396">Módulo de reto</text>
    <text x="320" y="494">Orquestación agéntica</text>
    <text x="320" y="592">Descubrimiento y clasificación</text>
    <text x="320" y="690">Catálogo normativo</text>
    <text x="320" y="794" fill="#1F3864">Evidencia y confianza</text>
  </g>
  <g font-size="20" fill="#E4ECF7">
    <text x="320" y="230">informes, plan de remediación, RoPA diferencial, borradores de DPIA</text>
    <text x="320" y="328">veredictos deterministas sobre evidencias · nunca decide la IA</text>
    <text x="320" y="426">sujetos sintéticos y siete familias de sondas activas</text>
    <text x="320" y="524">planificación de campañas con LLM 100% local</text>
    <text x="320" y="622">inventario de sistemas, localización de datos personales, grafo de lineaje</text>
    <text x="320" y="720">normas traducidas a obligaciones y controles ejecutables</text>
    <text x="320" y="824" fill="#3A3113">cadena criptográfica de evidencias y credenciales verificables</text>
  </g>

  <!-- Etiquetas de tecnología -->
  <g font-size="19" text-anchor="middle">
    <rect x="1160" y="286" rx="10" width="200" height="40" fill="#FFFFFF" opacity="0.92"/><text x="1260" y="313" fill="#26437A" font-weight="bold">OPA / Rego</text>
    <rect x="1160" y="482" rx="10" width="200" height="40" fill="#FFFFFF" opacity="0.92"/><text x="1260" y="509" fill="#2E8F8F" font-weight="bold">LangGraph · MCP</text>
    <rect x="1120" y="580" rx="10" width="240" height="40" fill="#FFFFFF" opacity="0.92"/><text x="1240" y="607" fill="#1F7A7A" font-weight="bold">OpenMetadata · Presidio</text>
    <rect x="1160" y="678" rx="10" width="200" height="40" fill="#FFFFFF" opacity="0.92"/><text x="1260" y="705" fill="#41556F" font-weight="bold">OSCAL · ODRL</text>
    <rect x="1120" y="776" rx="10" width="240" height="40" fill="#FFFFFF" opacity="0.95"/><text x="1240" y="803" fill="#1F3864" font-weight="bold">Auditree · XFSC · W3C VC</text>
  </g>

  <!-- Flechas laterales de sentido -->
  <g font-size="20" fill="#41556F">
    <path d="M1480 800 L1480 220" stroke="#1F7A7A" stroke-width="5" fill="none"/>
    <polygon points="1480,205 1468,228 1492,228" fill="#1F7A7A"/>
    <text x="1520" y="520" transform="rotate(90 1520 520)" text-anchor="middle" font-size="21" fill="#1F7A7A" font-weight="bold">de la evidencia al informe</text>
    <path d="M120 220 L120 800" stroke="#7A93B8" stroke-width="5" fill="none"/>
    <polygon points="120,815 108,792 132,792" fill="#7A93B8"/>
    <text x="82" y="510" transform="rotate(-90 82 510)" text-anchor="middle" font-size="21" fill="#41556F" font-weight="bold">todo se ancla en la capa C0</text>
  </g>

  <rect x="80" y="880" width="1440" height="2" fill="#C9A227"/>
  <text x="800" y="925" text-anchor="middle" font-size="23" font-style="italic" fill="#1F3864">100 componentes de ingeniería (ARG-001 a ARG-100) construyen estas siete capas en diez fases.</text>
  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
