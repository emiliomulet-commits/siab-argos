<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F7A7A"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D07 · B03-P02</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">«La IA propone, el motor dispone»</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">El principio rector del diseño de ARGOS</text>

  <!-- Columna IA -->
  <g filter="url(#sh)"><rect x="90" y="190" rx="18" width="560" height="480" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/></g>
  <rect x="90" y="190" rx="18" width="560" height="76" fill="#1F7A7A"/>
  <text x="370" y="240" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">LA IA PROPONE</text>
  <text x="370" y="305" text-anchor="middle" font-size="23" font-style="italic" fill="#4E7676">Modelo de lenguaje 100% local</text>
  <g font-size="24" fill="#1E3A3A">
    <rect x="130" y="335" rx="10" width="480" height="64" fill="#FFFFFF" stroke="#A9CFCF"/><text x="160" y="375">▪  Planifica las campañas de reto</text>
    <rect x="130" y="415" rx="10" width="480" height="64" fill="#FFFFFF" stroke="#A9CFCF"/><text x="160" y="455">▪  Interpreta el contexto de los sistemas</text>
    <rect x="130" y="495" rx="10" width="480" height="64" fill="#FFFFFF" stroke="#A9CFCF"/><text x="160" y="535">▪  Redacta informes y explicaciones</text>
  </g>
  <text x="370" y="625" text-anchor="middle" font-size="22" font-weight="bold" fill="#C0392B">Nunca decide un veredicto</text>

  <!-- Flecha central -->
  <g filter="url(#sh)"><rect x="690" y="380" rx="14" width="220" height="90" fill="#1F3864"/></g>
  <text x="800" y="418" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">propuesta +</text>
  <text x="800" y="448" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">evidencias</text>
  <line x1="655" y1="425" x2="686" y2="425" stroke="#1F7A7A" stroke-width="6" marker-end="url(#arw)"/>
  <line x1="912" y1="425" x2="943" y2="425" stroke="#1F7A7A" stroke-width="6" marker-end="url(#arw)"/>

  <!-- Columna Motor -->
  <g filter="url(#sh)"><rect x="950" y="190" rx="18" width="560" height="480" fill="#F4F6FA" stroke="#1F3864" stroke-width="2.5"/></g>
  <rect x="950" y="190" rx="18" width="560" height="76" fill="#1F3864"/>
  <text x="1230" y="240" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">EL MOTOR DISPONE</text>
  <text x="1230" y="305" text-anchor="middle" font-size="23" font-style="italic" fill="#5A6B85">Motor de políticas determinista (OPA/Rego)</text>
  <g font-size="24" fill="#26324A">
    <rect x="990" y="335" rx="10" width="480" height="64" fill="#FFFFFF" stroke="#B8C4D8"/><text x="1020" y="375">▪  Evalúa evidencias técnicas reales</text>
    <rect x="990" y="415" rx="10" width="480" height="64" fill="#FFFFFF" stroke="#B8C4D8"/><text x="1020" y="455">▪  Aplica reglas explícitas y auditables</text>
    <rect x="990" y="495" rx="10" width="480" height="64" fill="#FFFFFF" stroke="#B8C4D8"/><text x="1020" y="535">▪  Emite el veredicto de conformidad</text>
  </g>
  <text x="1230" y="625" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F7A7A">Mismo dato de entrada → mismo veredicto</text>

  <!-- Banda de consecuencia -->
  <g filter="url(#sh)"><rect x="90" y="720" rx="18" width="1420" height="170" fill="#1F3864"/></g>
  <rect x="90" y="720" rx="18" width="14" height="170" fill="#C9A227"/>
  <text x="800" y="785" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">Una «alucinación» del modelo no puede convertirse en conclusión jurídica</text>
  <text x="800" y="830" text-anchor="middle" font-size="24" fill="#CFE0F5">Cada veredicto referencia la regla exacta y la evidencia exacta que lo produjeron;</text>
  <text x="800" y="862" text-anchor="middle" font-size="24" fill="#CFE0F5">las decisiones con efectos jurídicos las toma siempre el equipo humano.</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
