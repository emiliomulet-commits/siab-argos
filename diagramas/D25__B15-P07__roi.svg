<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B33C"/><stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F7A7A"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D25 · B15-P07</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Cuál es el retorno de la inversión en ARGOS?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Cuatro fuentes de valor: dos de ahorro, una de eficiencia y una de ingresos</text>

  <!-- Cuatro fuentes -->
  <g filter="url(#sh)">
    <rect x="90" y="185" rx="16" width="680" height="220" fill="#F4F6FA" stroke="#1F3864" stroke-width="2.5"/>
    <rect x="830" y="185" rx="16" width="680" height="220" fill="#F4F6FA" stroke="#1F3864" stroke-width="2.5"/>
    <rect x="90" y="435" rx="16" width="680" height="220" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="830" y="435" rx="16" width="680" height="220" fill="#FBF6E2" stroke="#C9A227" stroke-width="3"/>
  </g>

  <circle cx="160" cy="250" r="34" fill="#1F3864"/><text x="160" y="262" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="215" y="245" font-size="25" font-weight="bold" fill="#1F3864">Menor coste de auditorías y expedientes</text>
  <text x="215" y="280" font-size="21" fill="#41556F">La evidencia ya está recogida, ordenada y sellada:</text>
  <g font-size="20" fill="#41556F">
    <text x="130" y="330">▪  auditorías más cortas y baratas</text>
    <text x="130" y="368">▪  respuestas a requerimientos en días, no meses</text>
  </g>

  <circle cx="900" cy="250" r="34" fill="#1F3864"/><text x="900" y="262" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="955" y="245" font-size="25" font-weight="bold" fill="#1F3864">Menor riesgo sancionador y reputacional</text>
  <text x="955" y="280" font-size="21" fill="#41556F">Las no conformidades se detectan y corrigen antes:</text>
  <g font-size="20" fill="#41556F">
    <text x="870" y="330">▪  la diligencia queda documentada y demostrable</text>
    <text x="870" y="368">▪  frente a &gt;5.880 M€ en sanciones UE desde 2018</text>
  </g>

  <circle cx="160" cy="500" r="34" fill="#1F7A7A"/><text x="160" y="512" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="215" y="495" font-size="25" font-weight="bold" fill="#1F7A7A">Horas de equipo liberadas</text>
  <text x="215" y="530" font-size="21" fill="#41556F">DPO y sistemas dejan de recolectar evidencias a mano:</text>
  <g font-size="20" fill="#41556F">
    <text x="130" y="580">▪  la verificación continua sustituye al proyecto anual</text>
    <text x="130" y="618">▪  el equipo se dedica a decidir, no a documentar</text>
  </g>

  <circle cx="900" cy="500" r="34" fill="#C9A227"/><text x="900" y="512" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F3864">4</text>
  <text x="955" y="495" font-size="25" font-weight="bold" fill="#8A6D12">Ingresos habilitados</text>
  <text x="955" y="530" font-size="21" fill="#6B5A1E">El cumplimiento demostrable abre puertas:</text>
  <g font-size="20" fill="#6B5A1E">
    <text x="870" y="580">▪  contratos y licitaciones que exigen demostrarlo</text>
    <text x="870" y="618">▪  admisión en espacios de datos con la credencial</text>
  </g>

  <!-- Convergencia -->
  <g fill="none" stroke="#1F7A7A" stroke-width="6">
    <path d="M430 655 Q 520 705 690 725" marker-end="url(#arw)"/>
    <path d="M1170 655 Q 1080 705 910 725" marker-end="url(#arw)"/>
  </g>

  <!-- Mensaje central -->
  <g filter="url(#sh)"><rect x="200" y="720" rx="18" width="1200" height="130" fill="url(#gold)"/></g>
  <rect x="200" y="720" rx="18" width="1200" height="130" fill="none" stroke="#1F3864" stroke-width="3"/>
  <text x="800" y="775" text-anchor="middle" font-size="28" font-weight="bold" fill="#1F3864">La credencial convierte el cumplimiento de coste en argumento comercial</text>
  <text x="800" y="818" text-anchor="middle" font-size="22" fill="#3A3113">Las fuentes 1-3 se estiman con datos del propio cliente en la fase de propuesta; la 4 es la que cambia la naturaleza de la inversión.</text>

  <!-- Banda inferior -->
  <g filter="url(#sh)"><rect x="80" y="885" rx="14" width="1440" height="56" fill="#1F3864"/></g>
  <text x="800" y="922" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">ARGOS no promete cifras genéricas de ROI: el caso de negocio se construye con las variables reales de cada organización</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
