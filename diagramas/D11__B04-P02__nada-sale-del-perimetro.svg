<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arwg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2E8B57"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D11 · B04-P02</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Sale algún dato del perímetro de mi organización?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">No. Ningún dato, metadato ni evidencia abandona su infraestructura</text>

  <!-- Perímetro del cliente -->
  <g filter="url(#sh)"><rect x="80" y="180" rx="24" width="980" height="600" fill="#F1F8F8"/></g>
  <rect x="80" y="180" rx="24" width="980" height="600" fill="none" stroke="#1F7A7A" stroke-width="6" stroke-dasharray="18 10"/>
  <rect x="120" y="150" rx="12" width="460" height="56" fill="#1F7A7A"/>
  <text x="350" y="188" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">PERÍMETRO DEL CLIENTE</text>

  <!-- Appliance ARGOS -->
  <g filter="url(#sh)"><rect x="140" y="270" rx="16" width="400" height="440" fill="#1F3864"/></g>
  <rect x="140" y="270" rx="16" width="400" height="14" fill="#C9A227"/>
  <circle cx="340" cy="360" r="52" fill="#C9A227"/>
  <text x="340" y="376" text-anchor="middle" font-size="38" font-weight="bold" fill="#1F3864">A</text>
  <text x="340" y="455" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">APPLIANCE ARGOS</text>
  <g font-size="21" fill="#EAF1FB">
    <text x="180" y="505">▪  Modelo de lenguaje local</text>
    <text x="180" y="543">▪  Motor de retos y evaluación</text>
    <text x="180" y="581">▪  Cadena de evidencias</text>
    <text x="180" y="619">▪  Hallazgos e informes</text>
    <text x="180" y="657">▪  Sin conexión saliente</text>
  </g>

  <!-- Sistemas del cliente -->
  <g filter="url(#sh)">
    <rect x="620" y="270" rx="14" width="380" height="90" fill="#FFFFFF" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="620" y="380" rx="14" width="380" height="90" fill="#FFFFFF" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="620" y="490" rx="14" width="380" height="90" fill="#FFFFFF" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="620" y="600" rx="14" width="380" height="90" fill="#FFFFFF" stroke="#1F7A7A" stroke-width="2"/>
  </g>
  <g font-size="23" fill="#1E3A3A">
    <text x="650" y="325">Bases de datos y réplicas</text>
    <text x="650" y="435">Repositorios de ficheros</text>
    <text x="650" y="545">Aplicaciones y ERPs</text>
    <text x="650" y="655">SaaS del propio cliente</text>
  </g>
  <g stroke="#1F7A7A" stroke-width="4" fill="none">
    <line x1="540" y1="315" x2="616" y2="315"/>
    <line x1="540" y1="425" x2="616" y2="425"/>
    <line x1="540" y1="535" x2="616" y2="535"/>
    <line x1="540" y1="645" x2="616" y2="645"/>
  </g>
  <text x="578" y="480" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F7A7A" transform="rotate(-90 578 480)">conectores · solo lectura</text>

  <!-- Exterior -->
  <g filter="url(#sh)"><rect x="1140" y="180" rx="20" width="380" height="600" fill="#F4F6FA" stroke="#B8C4D8" stroke-width="2"/></g>
  <text x="1330" y="235" text-anchor="middle" font-size="25" font-weight="bold" fill="#41556F">EXTERIOR</text>
  <g filter="url(#sh)"><rect x="1180" y="270" rx="14" width="300" height="140" fill="#FFFFFF" stroke="#B8C4D8"/></g>
  <text x="1330" y="320" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">Proveedor ARGOS</text>
  <text x="1330" y="352" text-anchor="middle" font-size="19" fill="#41556F">publica actualizaciones</text>
  <text x="1330" y="378" text-anchor="middle" font-size="19" fill="#41556F">del catálogo firmadas</text>

  <!-- Flecha entrada única -->
  <line x1="1180" y1="470" x2="1075" y2="470" stroke="#2E8B57" stroke-width="7" marker-end="url(#arwg)"/>
  <rect x="1105" y="420" rx="10" width="330" height="0" fill="none"/>
  <text x="1330" y="452" text-anchor="middle" font-size="20" font-weight="bold" fill="#2E8B57">ÚNICO SENTIDO: ENTRADA</text>
  <text x="1330" y="482" text-anchor="middle" font-size="19" fill="#3B5A48">paquetes firmados, aplicados</text>
  <text x="1330" y="508" text-anchor="middle" font-size="19" fill="#3B5A48">por el propio cliente</text>

  <!-- Salida prohibida -->
  <line x1="1075" y1="620" x2="1180" y2="620" stroke="#C0392B" stroke-width="7" stroke-dasharray="14 10"/>
  <circle cx="1128" cy="620" r="34" fill="#FFFFFF" stroke="#C0392B" stroke-width="6"/>
  <line x1="1104" y1="596" x2="1152" y2="644" stroke="#C0392B" stroke-width="6"/>
  <text x="1330" y="600" text-anchor="middle" font-size="20" font-weight="bold" fill="#C0392B">SALIDA: NINGUNA</text>
  <text x="1330" y="632" text-anchor="middle" font-size="19" fill="#7A3A32">sin telemetría, sin nube,</text>
  <text x="1330" y="658" text-anchor="middle" font-size="19" fill="#7A3A32">sin datos al proveedor</text>
  <text x="1330" y="720" text-anchor="middle" font-size="19" font-style="italic" fill="#41556F">El proveedor no ve, ni puede</text>
  <text x="1330" y="746" text-anchor="middle" font-size="19" font-style="italic" fill="#41556F">ver, sus resultados</text>

  <!-- Banda inferior -->
  <g filter="url(#sh)"><rect x="80" y="820" rx="16" width="1440" height="110" fill="#1F3864"/></g>
  <rect x="80" y="820" rx="16" width="14" height="110" fill="#C9A227"/>
  <text x="800" y="866" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">No existe modalidad SaaS, por diseño</text>
  <text x="800" y="896" text-anchor="middle" font-size="21" fill="#CFE0F5">El mapa de datos y las debilidades de una organización no deben residir en la nube de un proveedor.</text><text x="800" y="922" text-anchor="middle" font-size="21" fill="#CFE0F5">La ausencia de conexión saliente es una propiedad verificable del producto.</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
