<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#2A4E8A"/><stop offset="1" stop-color="#1F3864"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D16 · B02-P01</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Qué normas verifica ARGOS?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">El paquete normativo europeo de datos, completo y de forma integrada</text>

  <!-- Radios -->
  <g stroke="#B8C4D8" stroke-width="3">
    <line x1="800" y1="480" x2="380" y2="270"/>
    <line x1="800" y1="480" x2="800" y2="235"/>
    <line x1="800" y1="480" x2="1220" y2="270"/>
    <line x1="800" y1="480" x2="330" y2="600"/>
    <line x1="800" y1="480" x2="800" y2="700"/>
    <line x1="800" y1="480" x2="1270" y2="600"/>
  </g>

  <!-- Núcleo -->
  <g filter="url(#sh)"><circle cx="800" cy="480" r="120" fill="url(#core)"/></g>
  <circle cx="800" cy="480" r="120" fill="none" stroke="#C9A227" stroke-width="5"/>
  <text x="800" y="465" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF">ARGOS</text>
  <text x="800" y="502" text-anchor="middle" font-size="19" fill="#CFE0F5">un catálogo, todas las</text>
  <text x="800" y="527" text-anchor="middle" font-size="19" fill="#CFE0F5">normas del perfil</text>

  <!-- Seis normas -->
  <g filter="url(#sh)">
    <rect x="130" y="190" rx="14" width="420" height="110" fill="#1F3864"/>
    <rect x="600" y="140" rx="14" width="400" height="96" fill="#1F7A7A"/>
    <rect x="1050" y="190" rx="14" width="420" height="110" fill="#1F3864"/>
    <rect x="110" y="560" rx="14" width="400" height="110" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="600" y="655" rx="14" width="400" height="96" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="1090" y="560" rx="14" width="400" height="110" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
  </g>
  <g text-anchor="middle">
    <text x="340" y="235" font-size="26" font-weight="bold" fill="#FFFFFF">RGPD + LOPDGDD</text>
    <text x="340" y="272" font-size="19" fill="#CFE0F5">protección de datos: la base de todo</text>

    <text x="800" y="182" font-size="26" font-weight="bold" fill="#FFFFFF">EHDS · Regl. 2025/327</text>
    <text x="800" y="216" font-size="19" fill="#DFF0F0">espacio europeo de datos de salud</text>

    <text x="1260" y="235" font-size="26" font-weight="bold" fill="#FFFFFF">Reglamento de IA</text>
    <text x="1260" y="272" font-size="19" fill="#CFE0F5">2024/1689 · alto riesgo y transparencia</text>

    <text x="310" y="605" font-size="26" font-weight="bold" fill="#1F3864">NIS2</text>
    <text x="310" y="642" font-size="19" fill="#41556F">ciberseguridad de entidades esenciales</text>

    <text x="800" y="698" font-size="26" font-weight="bold" fill="#1F3864">Data Act</text>
    <text x="800" y="732" font-size="19" fill="#41556F">datos de productos conectados</text>

    <text x="1290" y="605" font-size="26" font-weight="bold" fill="#1F3864">Data Governance Act</text>
    <text x="1290" y="642" font-size="19" fill="#41556F">intermediación y reutilización de datos</text>
  </g>

  <!-- Marcos de seguridad -->
  <g filter="url(#sh)"><rect x="130" y="800" rx="16" width="1340" height="110" fill="#FBF6E2" stroke="#C9A227" stroke-width="3"/></g>
  <text x="800" y="845" text-anchor="middle" font-size="25" font-weight="bold" fill="#8A6D12">+ Marcos de seguridad de referencia</text>
  <text x="800" y="882" text-anchor="middle" font-size="22" fill="#3A3113">ENS (RD 311/2022) · ISO 27001 · ISO 27701 · perfiles nacionales y sectoriales ampliables</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
