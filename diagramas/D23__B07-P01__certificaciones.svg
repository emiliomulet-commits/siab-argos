<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D23 · B07-P01</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Qué certificaciones persigue ARGOS como producto?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Una herramienta de cumplimiento solo es creíble si ella misma está certificada</text>

  <!-- Frontón -->
  <g filter="url(#sh)"><path d="M180 320 L800 185 L1420 320 L1420 380 L180 380 Z" fill="#1F3864"/></g>
  <text x="800" y="300" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">CONFIANZA VERIFICADA POR TERCEROS INDEPENDIENTES</text>
  <text x="800" y="352" text-anchor="middle" font-size="21" fill="#CFE0F5">el mismo estándar que ARGOS exige a los sistemas que verifica</text>

  <!-- Cuatro pilares -->
  <g filter="url(#sh)">
    <rect x="200" y="410" rx="14" width="290" height="360" fill="#F4F6FA" stroke="#1F3864" stroke-width="2.5"/>
    <rect x="510" y="410" rx="14" width="290" height="360" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="820" y="410" rx="14" width="290" height="360" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="1130" y="410" rx="14" width="290" height="360" fill="#FBF6E2" stroke="#C9A227" stroke-width="3"/>
  </g>

  <rect x="200" y="410" rx="14" width="290" height="60" fill="#1F3864"/>
  <text x="345" y="450" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF">1 · Seguridad</text>
  <g text-anchor="middle" font-size="22" fill="#26324A">
    <text x="345" y="525" font-weight="bold">ENS categoría ALTA</text>
    <text x="345" y="565" font-weight="bold">ISO 27001 · 27701</text>
    <text x="345" y="625" font-size="19" fill="#41556F">condición de acceso al</text>
    <text x="345" y="652" font-size="19" fill="#41556F">sector público español</text>
    <text x="345" y="679" font-size="19" fill="#41556F">y al sanitario (SNS)</text>
  </g>

  <rect x="510" y="410" rx="14" width="290" height="60" fill="#1F7A7A"/>
  <text x="655" y="450" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF">2 · Gestión de IA</text>
  <g text-anchor="middle" font-size="22" fill="#1E3A3A">
    <text x="655" y="525" font-weight="bold">ISO 42001</text>
    <text x="655" y="565" font-weight="bold">Reglamento de IA</text>
    <text x="655" y="625" font-size="19" fill="#41556F">arts. 12, 13 y 14 asumidos</text>
    <text x="655" y="652" font-size="19" fill="#41556F">voluntariamente: registro,</text>
    <text x="655" y="679" font-size="19" fill="#41556F">transparencia, supervisión</text>
  </g>

  <rect x="820" y="410" rx="14" width="290" height="60" fill="#1F7A7A"/>
  <text x="965" y="450" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF">3 · Soberanía</text>
  <g text-anchor="middle" font-size="22" fill="#1E3A3A">
    <text x="965" y="525" font-weight="bold">Label Gaia-X</text>
    <text x="965" y="565" font-weight="bold">Lista de Confianza</text>
    <text x="965" y="625" font-size="19" fill="#41556F">verificado vía GXDCH:</text>
    <text x="965" y="652" font-size="19" fill="#41556F">la credencial la emite un</text>
    <text x="965" y="679" font-size="19" fill="#41556F">servicio a su vez acreditado</text>
  </g>

  <rect x="1130" y="410" rx="14" width="290" height="60" fill="#C9A227"/>
  <text x="1275" y="450" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">4 · Protección de datos</text>
  <g text-anchor="middle" font-size="22" fill="#3A3113">
    <text x="1275" y="525" font-weight="bold">Sello art. 42 RGPD</text>
    <text x="1275" y="565" font-weight="bold">(Europrivacy) · AEPD</text>
    <text x="1275" y="625" font-size="19" fill="#6B5A1E">y adhesión a código de</text>
    <text x="1275" y="652" font-size="19" fill="#6B5A1E">conducta del art. 40:</text>
    <text x="1275" y="679" font-size="19" fill="#6B5A1E">lenguaje natural del DPO</text>
  </g>

  <!-- Matiz importante -->
  <g filter="url(#sh)"><rect x="180" y="805" rx="16" width="1240" height="125" fill="#1F3864"/></g>
  <rect x="180" y="805" rx="16" width="14" height="125" fill="#C9A227"/>
  <text x="800" y="848" text-anchor="middle" font-size="25" font-weight="bold" fill="#FFFFFF">Matiz honesto: ARGOS no certifica a su organización — la prepara</text>
  <text x="800" y="884" text-anchor="middle" font-size="20" fill="#CFE0F5">Certificar corresponde a organismos acreditados; ARGOS mantiene el expediente</text><text x="800" y="911" text-anchor="middle" font-size="20" fill="#CFE0F5">técnico completo y verificable para que ese proceso parta con todo hecho.</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
