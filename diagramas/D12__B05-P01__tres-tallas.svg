<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D12 · B05-P01</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Qué hardware necesita ARGOS?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Tres tallas del Servidor Cognitivo (COGNITIV), o hardware equivalente del cliente</text>

  <!-- Tres tallas -->
  <g filter="url(#sh)">
    <rect x="110" y="200" rx="18" width="420" height="430" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="590" y="180" rx="18" width="420" height="450" fill="#F4F6FA" stroke="#1F3864" stroke-width="2.5"/>
    <rect x="1070" y="160" rx="18" width="420" height="470" fill="#FBF6E2" stroke="#C9A227" stroke-width="3"/>
  </g>

  <rect x="110" y="200" rx="18" width="420" height="90" fill="#1F7A7A"/>
  <text x="320" y="243" text-anchor="middle" font-size="34" font-weight="bold" fill="#FFFFFF">TALLA S</text>
  <text x="320" y="275" text-anchor="middle" font-size="20" fill="#DFF0F0">punto de entrada</text>

  <rect x="590" y="180" rx="18" width="420" height="90" fill="#1F3864"/>
  <text x="800" y="223" text-anchor="middle" font-size="34" font-weight="bold" fill="#FFFFFF">TALLA M</text>
  <text x="800" y="255" text-anchor="middle" font-size="20" fill="#CFE0F5">despliegue corporativo</text>

  <rect x="1070" y="160" rx="18" width="420" height="90" fill="#C9A227"/>
  <text x="1280" y="203" text-anchor="middle" font-size="34" font-weight="bold" fill="#1F3864">TALLA L</text>
  <text x="1280" y="235" text-anchor="middle" font-size="20" fill="#3A3113">grandes organizaciones</text>

  <g font-size="22" fill="#1E3A3A">
    <text x="150" y="345">▪  Alcance acotado a los</text><text x="176" y="375">sistemas críticos</text>
    <text x="150" y="425">▪  Organizaciones medianas</text>
    <text x="150" y="475">▪  Pilotos y primera fase</text>
    <text x="150" y="525">▪  Inferencia local incluida</text>
  </g>
  <g font-size="22" fill="#26324A">
    <text x="630" y="325">▪  Parque amplio de sistemas</text>
    <text x="630" y="375">▪  Campañas recurrentes</text><text x="656" y="405">sobre inventario completo</text>
    <text x="630" y="455">▪  Varios dominios de datos</text>
    <text x="630" y="505">▪  Mayor capacidad de</text><text x="656" y="535">clasificación e inferencia</text>
  </g>
  <g font-size="22" fill="#3A3113">
    <text x="1110" y="305">▪  Miles de sistemas y</text><text x="1136" y="335">terabytes de datos</text>
    <text x="1110" y="385">▪  Campañas paralelas de</text><text x="1136" y="415">alta intensidad</text>
    <text x="1110" y="465">▪  Grupos multi-sede</text>
    <text x="1110" y="515">▪  Máxima capacidad de</text><text x="1136" y="545">inferencia y evidencia</text>
  </g>

  <!-- Base común -->
  <g filter="url(#sh)"><rect x="110" y="660" rx="16" width="1380" height="110" fill="#1F3864"/></g>
  <rect x="110" y="660" rx="16" width="14" height="110" fill="#C9A227"/>
  <text x="800" y="706" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">Base común: Servidor Cognitivo · Lenovo ThinkSystem SR675 V3</text>
  <text x="800" y="744" text-anchor="middle" font-size="22" fill="#CFE0F5">Plataforma de IA soberana on-premise de Software in a Box · también desplegable sobre hardware equivalente del cliente</text>

  <!-- Criterios de dimensionado -->
  <text x="110" y="825" font-size="24" font-weight="bold" fill="#1F3864">La talla se elige según tres variables:</text>
  <g filter="url(#sh)">
    <rect x="110" y="845" rx="12" width="440" height="66" fill="#F4F6FA" stroke="#B8C4D8"/>
    <rect x="580" y="845" rx="12" width="440" height="66" fill="#F4F6FA" stroke="#B8C4D8"/>
    <rect x="1050" y="845" rx="12" width="440" height="66" fill="#F4F6FA" stroke="#B8C4D8"/>
  </g>
  <g text-anchor="middle" font-size="22" fill="#26324A">
    <text x="330" y="886">1 · Nº de sistemas a verificar</text>
    <text x="800" y="886">2 · Tamaño del inventario de datos</text>
    <text x="1270" y="886">3 · Intensidad de las campañas</text>
  </g>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
