<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D20 · B12-P17</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">Una brecha de datos: 72 horas para notificar</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Lo que la autoridad preguntará — y cuánto se tarda en responder</text>

  <!-- Reloj central -->
  <g filter="url(#sh)"><circle cx="800" cy="300" r="105" fill="#1F3864"/></g>
  <circle cx="800" cy="300" r="105" fill="none" stroke="#C9A227" stroke-width="5"/>
  <circle cx="800" cy="300" r="78" fill="none" stroke="#CFE0F5" stroke-width="3"/>
  <line x1="800" y1="300" x2="800" y2="243" stroke="#C9A227" stroke-width="7" stroke-linecap="round"/>
  <line x1="800" y1="300" x2="843" y2="322" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <text x="800" y="435" text-anchor="middle" font-size="30" font-weight="bold" fill="#C0392B">72 HORAS</text>
  <text x="800" y="468" text-anchor="middle" font-size="20" fill="#41556F">art. 33 RGPD · notificación a la autoridad</text>

  <!-- Preguntas de la autoridad -->
  <g filter="url(#sh)"><rect x="80" y="185" rx="14" width="520" height="270" fill="#F4F6FA" stroke="#B8C4D8" stroke-width="2"/></g>
  <text x="340" y="230" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">Lo que hay que saber responder</text>
  <g font-size="21" fill="#26324A">
    <text x="115" y="278">▪  ¿Qué sistemas están afectados?</text>
    <text x="115" y="318">▪  ¿Qué categorías y volúmenes de datos?</text>
    <text x="115" y="358">▪  ¿A qué terceros se cedían?</text>
    <text x="115" y="398">▪  ¿Qué controles había antes del incidente?</text>
    <text x="115" y="438">▪  ¿Qué medidas se han tomado?</text>
  </g>

  <g filter="url(#sh)"><rect x="1000" y="185" rx="14" width="520" height="270" fill="#F4F6FA" stroke="#B8C4D8" stroke-width="2"/></g>
  <text x="1260" y="230" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">Lo que evalúa la autoridad</text>
  <g font-size="21" fill="#26324A">
    <text x="1035" y="285">▪  La diligencia previa del responsable</text>
    <text x="1035" y="330">▪  El estado real de los controles</text>
    <text x="1035" y="375">▪  La calidad y plazo de la notificación</text>
    <text x="1035" y="420">▪  La trazabilidad de lo ocurrido</text>
  </g>

  <!-- Comparativa -->
  <g filter="url(#sh)">
    <rect x="80" y="520" rx="18" width="700" height="330" fill="#FBEAEA" stroke="#C0392B" stroke-width="3"/>
    <rect x="820" y="520" rx="18" width="700" height="330" fill="#EAF6EF" stroke="#2E8B57" stroke-width="3"/>
  </g>
  <rect x="80" y="520" rx="18" width="700" height="64" fill="#C0392B"/>
  <text x="430" y="562" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">SIN INVENTARIO VIVO</text>
  <g font-size="22" fill="#7A3A32">
    <text x="120" y="630">▪  Semanas reconstruyendo qué sistemas y</text>
    <text x="146" y="660">qué datos hay, mientras el reloj corre</text>
    <text x="120" y="700">▪  Notificación incompleta o tardía</text>
    <text x="120" y="740">▪  Sin evidencia del estado previo de los</text>
    <text x="146" y="770">controles: la diligencia no se puede probar</text>
    <text x="120" y="815" font-weight="bold">Resultado: expediente cuesta arriba</text>
  </g>

  <rect x="820" y="520" rx="18" width="700" height="64" fill="#2E8B57"/>
  <text x="1170" y="562" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">CON ARGOS</text>
  <g font-size="22" fill="#3B5A48">
    <text x="860" y="630">▪  El inventario vivo responde en horas:</text>
    <text x="886" y="660">sistemas, categorías, volúmenes, cesiones</text>
    <text x="860" y="700">▪  Notificación completa y en plazo</text>
    <text x="860" y="740">▪  La cadena de evidencias documenta el</text>
    <text x="886" y="770">estado de los controles antes del incidente</text>
    <text x="860" y="815" font-weight="bold">Resultado: la diligencia queda demostrada</text>
  </g>

  <!-- Banda inferior -->
  <g filter="url(#sh)"><rect x="80" y="880" rx="14" width="1440" height="56" fill="#1F3864"/></g>
  <text x="800" y="917" text-anchor="middle" font-size="23" font-weight="bold" fill="#FFFFFF">ARGOS no gestiona el incidente: hace posible responder a él con datos, no con estimaciones</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
