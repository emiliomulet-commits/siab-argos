<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C9A227"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D21 · B15-P01</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">«Ya tengo una plataforma GRC. ¿Para qué necesito ARGOS?»</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">No compiten: la GRC gobierna, ARGOS demuestra</text>

  <!-- Columna GRC -->
  <g filter="url(#sh)"><rect x="90" y="185" rx="18" width="620" height="440" fill="#F4F6FA" stroke="#1F3864" stroke-width="2.5"/></g>
  <rect x="90" y="185" rx="18" width="620" height="72" fill="#1F3864"/>
  <text x="400" y="232" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">SU PLATAFORMA GRC — consérvela</text>
  <text x="400" y="295" text-anchor="middle" font-size="22" font-style="italic" fill="#5A6B85">Gobierna el cumplimiento</text>
  <g font-size="23" fill="#26324A">
    <text x="135" y="345">▪  Organiza políticas, riesgos y flujos de trabajo</text>
    <text x="135" y="390">▪  Gestiona cuestionarios y tareas</text>
    <text x="135" y="435">▪  Cuadros de mando y reporting</text>
  </g>
  <g filter="url(#sh)"><rect x="130" y="480" rx="12" width="540" height="105" fill="#FBEAEA" stroke="#C0392B" stroke-width="2"/></g>
  <text x="400" y="522" text-anchor="middle" font-size="22" font-weight="bold" fill="#C0392B">Su límite</text>
  <text x="400" y="551" text-anchor="middle" font-size="20" fill="#7A3A32">sus evidencias son declarativas o de configuración:</text>
  <text x="400" y="576" text-anchor="middle" font-size="20" fill="#7A3A32">no prueban el comportamiento real del dato</text>

  <!-- Columna ARGOS -->
  <g filter="url(#sh)"><rect x="890" y="185" rx="18" width="620" height="440" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/></g>
  <rect x="890" y="185" rx="18" width="620" height="72" fill="#1F7A7A"/>
  <text x="1200" y="232" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">ARGOS — la capa que falta</text>
  <text x="1200" y="295" text-anchor="middle" font-size="22" font-style="italic" fill="#4E7676">Demuestra el cumplimiento</text>
  <g font-size="23" fill="#1E3A3A">
    <text x="935" y="345">▪  Sondas activas sobre los sistemas reales</text>
    <text x="935" y="390">▪  Comportamiento del dato: borrado, accesos, flujos</text>
    <text x="935" y="435">▪  Veredictos con evidencia técnica trazable</text>
  </g>
  <g filter="url(#sh)"><rect x="930" y="480" rx="12" width="540" height="105" fill="#EAF6EF" stroke="#2E8B57" stroke-width="2"/></g>
  <text x="1200" y="522" text-anchor="middle" font-size="22" font-weight="bold" fill="#2E8B57">Su aportación</text>
  <text x="1200" y="560" text-anchor="middle" font-size="20" fill="#3B5A48">prueba lo que la GRC solo registra</text>

  <!-- Flecha de integración -->
  <g filter="url(#sh)"><rect x="330" y="680" rx="16" width="940" height="130" fill="#FBF6E2" stroke="#C9A227" stroke-width="3"/></g>
  <line x1="400" y1="625" x2="400" y2="672" stroke="#1F3864" stroke-width="6"/>
  <line x1="1200" y1="625" x2="1200" y2="672" stroke="#1F7A7A" stroke-width="6"/>
  <text x="800" y="730" text-anchor="middle" font-size="25" font-weight="bold" fill="#8A6D12">Integración por API</text>
  <text x="800" y="768" text-anchor="middle" font-size="21" fill="#3A3113">Los controles de la GRC se mapean contra el catálogo de ARGOS: cada evidencia activa</text>
  <text x="800" y="796" text-anchor="middle" font-size="21" fill="#3A3113">alimenta automáticamente el control correspondiente de su plataforma actual.</text>

  <!-- Banda inferior -->
  <g filter="url(#sh)"><rect x="80" y="855" rx="14" width="1440" height="70" fill="#1F3864"/></g>
  <rect x="80" y="855" rx="14" width="14" height="70" fill="#C9A227"/>
  <text x="800" y="900" text-anchor="middle" font-size="25" font-weight="bold" fill="#FFFFFF">La GRC conserva el gobierno; ARGOS le entrega lo que ninguna GRC produce por sí misma: prueba</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
