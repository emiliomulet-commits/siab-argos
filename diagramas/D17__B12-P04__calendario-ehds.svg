<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F7A7A"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D17 · B12-P04</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">El calendario del EHDS, convertido en plan de trabajo</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Reglamento (UE) 2025/327 · Espacio Europeo de Datos de Salud</text>

  <!-- Línea temporal -->
  <g filter="url(#sh)"><rect x="80" y="170" rx="18" width="1440" height="330" fill="#FFFFFF" stroke="#B8C4D8" stroke-width="2"/></g>
  <line x1="160" y1="330" x2="1450" y2="330" stroke="#1F3864" stroke-width="7"/>
  <polygon points="1455,330 1433,319 1433,341" fill="#1F3864"/>

  <circle cx="280" cy="330" r="16" fill="#1F7A7A"/>
  <text x="280" y="270" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F3864">26 mar 2025</text>
  <text x="280" y="300" text-anchor="middle" font-size="19" fill="#41556F">entrada en vigor</text>
  <text x="280" y="378" text-anchor="middle" font-size="20" fill="#41556F">empieza la cuenta</text>
  <text x="280" y="404" text-anchor="middle" font-size="20" fill="#41556F">atrás para el sector</text>

  <line x1="620" y1="240" x2="620" y2="430" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="583" y="200" rx="10" width="80" height="36" fill="#C0392B"/>
  <text x="623" y="225" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">HOY</text>
  <text x="620" y="460" text-anchor="middle" font-size="19" fill="#C0392B">sep 2026: quedan 6 meses para la aplicación general</text>

  <circle cx="860" cy="330" r="19" fill="#C9A227"/>
  <text x="860" y="270" text-anchor="middle" font-size="25" font-weight="bold" fill="#8A6D12">26 mar 2027</text>
  <text x="860" y="300" text-anchor="middle" font-size="19" fill="#41556F">aplicación general</text>
  <text x="860" y="378" text-anchor="middle" font-size="20" fill="#41556F">acceso del paciente,</text>
  <text x="860" y="404" text-anchor="middle" font-size="20" fill="#41556F">HCE conformes, uso 1º</text>

  <circle cx="1340" cy="330" r="16" fill="#1F7A7A"/>
  <text x="1340" y="270" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F3864">hasta 2035</text>
  <text x="1340" y="300" text-anchor="middle" font-size="19" fill="#41556F">obligaciones escalonadas</text>
  <text x="1340" y="378" text-anchor="middle" font-size="20" fill="#41556F">uso secundario y</text>
  <text x="1340" y="404" text-anchor="middle" font-size="20" fill="#41556F">categorías ampliadas</text>

  <!-- Cómo lo usa ARGOS -->
  <text x="110" y="560" font-size="27" font-weight="bold" fill="#1F3864">Qué hace ARGOS con este calendario</text>
  <g filter="url(#sh)">
    <rect x="110" y="585" rx="16" width="430" height="230" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="585" y="585" rx="16" width="430" height="230" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2.5"/>
    <rect x="1060" y="585" rx="16" width="430" height="230" fill="#FBF6E2" stroke="#C9A227" stroke-width="3"/>
  </g>
  <circle cx="165" cy="640" r="27" fill="#1F7A7A"/><text x="165" y="650" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="210" y="648" font-size="24" font-weight="bold" fill="#1F7A7A">Perfil EHDS en el catálogo</text>
  <text x="140" y="700" font-size="21" fill="#41556F">Cada obligación del reglamento,</text>
  <text x="140" y="730" font-size="21" fill="#41556F">traducida a controles ejecutables</text>
  <text x="140" y="760" font-size="21" fill="#41556F">y asociada a su fecha exigible.</text>

  <circle cx="640" cy="640" r="27" fill="#1F7A7A"/><text x="640" y="650" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="685" y="648" font-size="24" font-weight="bold" fill="#1F7A7A">Medición de la distancia</text>
  <text x="615" y="700" font-size="21" fill="#41556F">Cada campaña muestra la brecha</text>
  <text x="615" y="730" font-size="21" fill="#41556F">entre el estado real de los sistemas</text>
  <text x="615" y="760" font-size="21" fill="#41556F">y las obligaciones de cada hito.</text>

  <circle cx="1115" cy="640" r="27" fill="#C9A227"/><text x="1115" y="650" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">3</text>
  <text x="1160" y="648" font-size="24" font-weight="bold" fill="#8A6D12">Plan medible por hito</text>
  <text x="1090" y="700" font-size="21" fill="#3A3113">El calendario regulatorio deja de</text>
  <text x="1090" y="730" font-size="21" fill="#3A3113">ser una amenaza abstracta y se</text>
  <text x="1090" y="760" font-size="21" fill="#3A3113">convierte en trabajo priorizado.</text>

  <!-- Banda inferior -->
  <g filter="url(#sh)"><rect x="80" y="855" rx="14" width="1440" height="70" fill="#1F3864"/></g>
  <rect x="80" y="855" rx="14" width="14" height="70" fill="#C9A227"/>
  <text x="800" y="900" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF">El EHDS no sustituye al RGPD: lo especializa para salud — en ARGOS conviven como perfiles superpuestos</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
