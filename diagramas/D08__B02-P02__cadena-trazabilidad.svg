<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D08 · B02-P02</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">De la norma jurídica a la prueba técnica</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">La cadena de trazabilidad que gobierna todo el catálogo de ARGOS</text>

  <!-- Cinco chevrones -->
  <g filter="url(#sh)">
    <path d="M80 220 L330 220 L380 300 L330 380 L80 380 L130 300 Z" fill="#1F3864"/>
    <path d="M360 220 L610 220 L660 300 L610 380 L360 380 L410 300 Z" fill="#26437A"/>
    <path d="M640 220 L890 220 L940 300 L890 380 L640 380 L690 300 Z" fill="#1F7A7A"/>
    <path d="M920 220 L1170 220 L1220 300 L1170 380 L920 380 L970 300 Z" fill="#2E8F8F"/>
    <path d="M1200 220 L1470 220 L1520 300 L1470 380 L1200 380 L1250 300 Z" fill="#C9A227"/>
  </g>
  <g text-anchor="middle" font-size="29" font-weight="bold" fill="#FFFFFF">
    <text x="245" y="290">NORMA</text>
    <text x="525" y="290">OBLIGACIÓN</text>
    <text x="805" y="290">CONTROL</text>
    <text x="1085" y="290">EVIDENCIA</text>
    <text x="1370" y="290" fill="#1F3864">VEREDICTO</text>
  </g>
  <g text-anchor="middle" font-size="19" fill="#E4ECF7">
    <text x="245" y="330">artículo del</text><text x="245" y="354">reglamento</text>
    <text x="525" y="330">deber concreto</text><text x="525" y="354">y verificable</text>
    <text x="805" y="330">prueba ejecutable</text><text x="805" y="354">sobre sistemas</text>
    <text x="1085" y="330">dato técnico con</text><text x="1085" y="354">sello temporal</text>
    <text x="1370" y="330" fill="#3A3113">conforme /</text><text x="1370" y="354" fill="#3A3113">no conforme</text>
  </g>

  <!-- Ejemplo aplicado -->
  <text x="110" y="470" font-size="27" font-weight="bold" fill="#1F3864">Ejemplo real: limitación del plazo de conservación</text>
  <g filter="url(#sh)">
    <rect x="80" y="500" rx="14" width="280" height="230" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="380" y="500" rx="14" width="280" height="230" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="680" y="500" rx="14" width="280" height="230" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="980" y="500" rx="14" width="280" height="230" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="1280" y="500" rx="14" width="240" height="230" fill="#FBF6E2" stroke="#C9A227" stroke-width="2.5"/>
  </g>
  <g font-size="21" fill="#26324A">
    <text x="105" y="545" font-weight="bold" fill="#1F3864">Art. 5.1.e RGPD</text>
    <text x="105" y="585">Los datos no se</text>
    <text x="105" y="613">conservarán más</text>
    <text x="105" y="641">tiempo del necesario</text>
    <text x="105" y="669">para su finalidad.</text>

    <text x="405" y="545" font-weight="bold" fill="#1F3864">Obligación</text>
    <text x="405" y="585">Cada tratamiento</text>
    <text x="405" y="613">respeta el plazo de</text>
    <text x="405" y="641">retención declarado</text>
    <text x="405" y="669">en el RoPA.</text>

    <text x="705" y="545" font-weight="bold" fill="#1F7A7A">Control</text>
    <text x="705" y="585">Contrastar retención</text>
    <text x="705" y="613">declarada con los</text>
    <text x="705" y="641">registros que existen</text>
    <text x="705" y="669">en cada repositorio.</text>

    <text x="1005" y="545" font-weight="bold" fill="#1F7A7A">Evidencia</text>
    <text x="1005" y="585">12.480 registros de</text>
    <text x="1005" y="613">2019 aún presentes</text>
    <text x="1005" y="641">en la BD histórica</text>
    <text x="1005" y="669">(sello: 2026-09-07).</text>

    <text x="1305" y="545" font-weight="bold" fill="#8A6D12">Veredicto</text>
    <text x="1305" y="590" font-size="25" font-weight="bold" fill="#C0392B">NO CONFORME</text>
    <text x="1305" y="628">Regla R-054 del</text>
    <text x="1305" y="656">catálogo v3.2</text>
    <text x="1305" y="684">→ plan remediación</text>
  </g>

  <!-- Banda inferior -->
  <g filter="url(#sh)"><rect x="80" y="790" rx="16" width="1440" height="120" fill="#1F3864"/></g>
  <rect x="80" y="790" rx="16" width="14" height="120" fill="#C9A227"/>
  <text x="800" y="840" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">Trazabilidad completa en ambos sentidos</text>
  <text x="800" y="878" text-anchor="middle" font-size="22" fill="#CFE0F5">De cualquier veredicto se llega al artículo que lo exige; de cualquier artículo, a las pruebas que lo verifican. Catálogo en estándares abiertos: OSCAL y ODRL.</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
