<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <linearGradient id="gapg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBEAEA"/><stop offset="1" stop-color="#F6D5D5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F7A7A"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D01 · B01-P02</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Qué problema resuelve ARGOS?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">La distancia entre el cumplimiento declarado y el cumplimiento efectivo</text>

  <!-- Columna izquierda: declarado -->
  <g filter="url(#sh)">
    <rect x="80" y="190" rx="18" width="520" height="470" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
  </g>
  <rect x="80" y="190" rx="18" width="520" height="70" fill="#1F3864"/>
  <text x="340" y="235" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">CUMPLIMIENTO DECLARADO</text>
  <text x="340" y="295" text-anchor="middle" font-size="23" font-style="italic" fill="#5A6B85">Lo que dicen los documentos</text>
  <g font-size="24" fill="#26324A">
    <rect x="120" y="325" rx="10" width="440" height="60" fill="#FFFFFF" stroke="#B8C4D8"/><text x="145" y="363">▪  Registro de actividades (RoPA)</text>
    <rect x="120" y="400" rx="10" width="440" height="60" fill="#FFFFFF" stroke="#B8C4D8"/><text x="145" y="438">▪  Políticas y procedimientos</text>
    <rect x="120" y="475" rx="10" width="440" height="60" fill="#FFFFFF" stroke="#B8C4D8"/><text x="145" y="513">▪  Evaluaciones de impacto (DPIA)</text>
    <rect x="120" y="550" rx="10" width="440" height="60" fill="#FFFFFF" stroke="#B8C4D8"/><text x="145" y="588">▪  Contratos de encargo</text>
  </g>

  <!-- Columna derecha: efectivo -->
  <g filter="url(#sh)">
    <rect x="1000" y="190" rx="18" width="520" height="470" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
  </g>
  <rect x="1000" y="190" rx="18" width="520" height="70" fill="#1F7A7A"/>
  <text x="1260" y="235" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">CUMPLIMIENTO EFECTIVO</text>
  <text x="1260" y="295" text-anchor="middle" font-size="23" font-style="italic" fill="#4E7676">Lo que hacen los sistemas</text>
  <g font-size="24" fill="#1E3A3A">
    <rect x="1040" y="325" rx="10" width="440" height="60" fill="#FFFFFF" stroke="#A9CFCF"/><text x="1065" y="363">▪  Bases de datos y réplicas</text>
    <rect x="1040" y="400" rx="10" width="440" height="60" fill="#FFFFFF" stroke="#A9CFCF"/><text x="1065" y="438">▪  Repositorios de ficheros</text>
    <rect x="1040" y="475" rx="10" width="440" height="60" fill="#FFFFFF" stroke="#A9CFCF"/><text x="1065" y="513">▪  Servicios SaaS y nube</text>
    <rect x="1040" y="550" rx="10" width="440" height="60" fill="#FFFFFF" stroke="#A9CFCF"/><text x="1065" y="588">▪  Flujos y cesiones reales</text>
  </g>

  <!-- La brecha -->
  <g filter="url(#sh)">
    <rect x="650" y="250" rx="16" width="300" height="350" fill="url(#gapg)" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="10 6"/>
  </g>
  <text x="800" y="308" text-anchor="middle" font-size="30" font-weight="bold" fill="#C0392B">LA BRECHA</text>
  <text x="800" y="345" text-anchor="middle" font-size="22" fill="#8E3A30">Ninguna autoridad sanciona</text>
  <text x="800" y="372" text-anchor="middle" font-size="22" fill="#8E3A30">por lo que dice un documento:</text>
  <text x="800" y="399" text-anchor="middle" font-size="22" font-weight="bold" fill="#8E3A30">sanciona por lo que hacen</text>
  <text x="800" y="426" text-anchor="middle" font-size="22" font-weight="bold" fill="#8E3A30">los sistemas</text>
  <text x="800" y="500" text-anchor="middle" font-size="46" font-weight="bold" fill="#C0392B">5.880 M€</text>
  <text x="800" y="535" text-anchor="middle" font-size="22" fill="#8E3A30">en sanciones UE desde 2018</text>
  <text x="800" y="565" text-anchor="middle" font-size="22" fill="#8E3A30">(1.200 M€ solo en 2024)</text>

  <!-- Banda ARGOS -->
  <g filter="url(#sh)">
    <rect x="80" y="730" rx="18" width="1440" height="190" fill="#1F3864"/>
  </g>
  <rect x="80" y="730" rx="18" width="14" height="190" fill="#C9A227"/>
  <circle cx="210" cy="825" r="62" fill="#C9A227"/>
  <text x="210" y="840" text-anchor="middle" font-size="40" font-weight="bold" fill="#1F3864">A</text>
  <text x="320" y="795" font-size="32" font-weight="bold" fill="#FFFFFF">ARGOS mide y cierra la brecha</text>
  <text x="320" y="840" font-size="25" fill="#CFE0F5">Convierte cada obligación legal en una prueba ejecutable sobre la infraestructura real</text>
  <text x="320" y="878" font-size="25" fill="#CFE0F5">y contrasta de forma continua lo declarado con lo que los sistemas hacen de verdad.</text>
  <path d="M600 660 Q 600 700 700 715" fill="none" stroke="#1F7A7A" stroke-width="5" marker-end="url(#arw)"/>
  <path d="M1000 660 Q 1000 700 900 715" fill="none" stroke="#1F7A7A" stroke-width="5" marker-end="url(#arw)"/>

  <text x="1560" y="975" text-anchor="end" font-size="18" fill="#9AA7BB">ARGOS · Base de conocimiento gráfica · Software in a Box</text>
</svg>
