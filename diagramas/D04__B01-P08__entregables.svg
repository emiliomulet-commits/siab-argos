<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B33C"/><stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F3864"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="230" height="50" fill="#C9A227"/>
  <text x="155" y="67" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F3864">D04 · B01-P08</text>
  <text x="300" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">¿Qué entrega ARGOS al final de una verificación?</text>
  <text x="300" y="94" font-size="24" fill="#CFE0F5">Cinco entregables generados desde evidencia técnica real</text>

  <!-- Origen -->
  <g filter="url(#sh)"><rect x="575" y="180" rx="18" width="450" height="132" fill="#1F3864"/></g>
  <rect x="575" y="180" rx="18" width="450" height="14" fill="#C9A227"/>
  <text x="800" y="238" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">CAMPAÑA DE VERIFICACIÓN</text>
  <text x="800" y="282" text-anchor="middle" font-size="21" fill="#CFE0F5">sondas → evidencias → veredictos deterministas</text>

  <!-- Conectores -->
  <g fill="none" stroke="#1F3864" stroke-width="4">
    <path d="M700 300 Q 400 340 300 395" marker-end="url(#arw)"/>
    <path d="M760 300 Q 640 350 620 395" marker-end="url(#arw)"/>
    <path d="M840 300 Q 960 350 980 395" marker-end="url(#arw)"/>
    <path d="M900 300 Q 1200 340 1300 395" marker-end="url(#arw)"/>
    <path d="M800 300 L800 640" marker-end="url(#arw)"/>
  </g>

  <!-- Cuatro entregables -->
  <g filter="url(#sh)">
    <rect x="105" y="405" rx="16" width="380" height="200" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="465" y="405" rx="16" width="310" height="200" fill="#F4F6FA" stroke="#1F3864" stroke-width="2" transform="translate(-35 0)"/>
    <rect x="825" y="405" rx="16" width="310" height="200" fill="#F4F6FA" stroke="#1F3864" stroke-width="2" transform="translate(-35 0)"/>
    <rect x="1115" y="405" rx="16" width="380" height="200" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
  </g>

  <text x="295" y="455" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">Informe de conformidad</text>
  <text x="295" y="498" text-anchor="middle" font-size="21" fill="#41556F">Cada control, cada evidencia</text>
  <text x="295" y="526" text-anchor="middle" font-size="21" fill="#41556F">y cada veredicto, con su</text>
  <text x="295" y="554" text-anchor="middle" font-size="21" fill="#41556F">referencia normativa exacta</text>

  <text x="585" y="455" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">Plan de remediación</text>
  <text x="585" y="498" text-anchor="middle" font-size="21" fill="#41556F">Priorizado por severidad</text>
  <text x="585" y="526" text-anchor="middle" font-size="21" fill="#41556F">y causa raíz; exportable</text>
  <text x="585" y="554" text-anchor="middle" font-size="21" fill="#41556F">al ticketing del cliente</text>

  <text x="945" y="455" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">RoPA diferencial</text>
  <text x="945" y="498" text-anchor="middle" font-size="21" fill="#41556F">Registro de actividades real</text>
  <text x="945" y="526" text-anchor="middle" font-size="21" fill="#41556F">cotejado con el declarado:</text>
  <text x="945" y="554" text-anchor="middle" font-size="21" fill="#41556F">las diferencias afloran solas</text>

  <text x="1305" y="455" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">Borradores de DPIA</text>
  <text x="1305" y="498" text-anchor="middle" font-size="21" fill="#41556F">Evaluaciones de impacto con</text>
  <text x="1305" y="526" text-anchor="middle" font-size="21" fill="#41556F">los riesgos detectados, listas</text>
  <text x="1305" y="554" text-anchor="middle" font-size="21" fill="#41556F">para revisión del DPO</text>

  <!-- Credencial (estrella, dorado) -->
  <g filter="url(#sh)"><rect x="370" y="655" rx="20" width="860" height="200" fill="url(#gold)"/></g>
  <rect x="370" y="655" rx="20" width="860" height="200" fill="none" stroke="#1F3864" stroke-width="3"/>
  <circle cx="470" cy="755" r="52" fill="#1F3864"/>
  <path d="M447 755 l16 16 l32 -34" fill="none" stroke="#C9A227" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="560" y="715" font-size="30" font-weight="bold" fill="#1F3864">CREDENCIAL VERIFICABLE (W3C · Gaia-X)</text>
  <text x="560" y="758" font-size="22" fill="#3A3113">El informe se firma con la huella raíz de la cadena de evidencias.</text>
  <text x="560" y="790" font-size="22" fill="#3A3113">Un tercero —auditor, autoridad, socio de espacio de datos— puede</text>
  <text x="560" y="822" font-size="22" fill="#3A3113">comprobar su integridad sin acceder a las evidencias.</text>

  <rect x="80" y="905" width="1440" height="2" fill="#C9A227"/>
  <text x="800" y="945" text-anchor="middle" font-size="23" font-style="italic" fill="#1F3864">Del cumplimiento como carpeta de documentos al cumplimiento como evidencia verificable.</text>
  <text x="1560" y="985" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
