<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3864"/><stop offset="1" stop-color="#2A4E8A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B33C"/><stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F7A7A"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect width="1600" height="118" fill="url(#hdr)"/>
  <rect y="118" width="1600" height="6" fill="#C9A227"/>
  <rect x="40" y="34" rx="14" width="270" height="50" fill="#C9A227"/>
  <text x="175" y="67" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F3864">D10 · B04-P06/07</text>
  <text x="340" y="56" font-size="34" font-weight="bold" fill="#FFFFFF">De la evidencia a la credencial verificable</text>
  <text x="340" y="94" font-size="24" fill="#CFE0F5">Integridad criptográfica de extremo a extremo, verificable por terceros</text>

  <!-- Cadena de evidencias -->
  <text x="110" y="205" font-size="26" font-weight="bold" fill="#1F3864">1 · Cadena de evidencias (append-only, SHA-256)</text>
  <g filter="url(#sh)">
    <rect x="110" y="230" rx="12" width="250" height="150" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="440" y="230" rx="12" width="250" height="150" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
    <rect x="770" y="230" rx="12" width="250" height="150" fill="#F1F8F8" stroke="#1F7A7A" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="235" y="272" font-size="24" font-weight="bold" fill="#1F7A7A">Evidencia E1</text>
    <text x="235" y="305" font-size="19" fill="#41556F">sonda · sistema · sello</text>
    <text x="235" y="345" font-size="18" font-family="monospace" fill="#1F3864">hash: a3f1…9c</text>
    <text x="565" y="272" font-size="24" font-weight="bold" fill="#1F7A7A">Evidencia E2</text>
    <text x="565" y="305" font-size="19" fill="#41556F">sonda · sistema · sello</text>
    <text x="565" y="345" font-size="18" font-family="monospace" fill="#1F3864">hash: 7b2e…41</text>
    <text x="895" y="272" font-size="24" font-weight="bold" fill="#1F7A7A">Evidencia E3 …</text>
    <text x="895" y="305" font-size="19" fill="#41556F">sonda · sistema · sello</text>
    <text x="895" y="345" font-size="18" font-family="monospace" fill="#1F3864">hash: d980…f5</text>
  </g>
  <!-- eslabones -->
  <g stroke="#1F7A7A" stroke-width="6" fill="none">
    <line x1="360" y1="305" x2="430" y2="305" marker-end="url(#arw)"/>
    <line x1="690" y1="305" x2="760" y2="305" marker-end="url(#arw)"/>
    <line x1="1020" y1="305" x2="1090" y2="305" marker-end="url(#arw)"/>
  </g>
  <text x="395" y="290" text-anchor="middle" font-size="16" fill="#41556F">encadena</text>
  <text x="725" y="290" text-anchor="middle" font-size="16" fill="#41556F">encadena</text>

  <!-- Huella raíz -->
  <g filter="url(#sh)"><rect x="1100" y="230" rx="12" width="420" height="150" fill="#1F3864"/></g>
  <text x="1310" y="278" text-anchor="middle" font-size="25" font-weight="bold" fill="#FFFFFF">HUELLA RAÍZ</text>
  <text x="1310" y="312" text-anchor="middle" font-size="20" fill="#CFE0F5">resume toda la cadena:</text>
  <text x="1310" y="345" text-anchor="middle" font-size="20" fill="#CFE0F5">alterar una evidencia la rompe</text>

  <text x="800" y="425" text-anchor="middle" font-size="22" font-style="italic" fill="#41556F">Cualquier modificación posterior de cualquier evidencia es matemáticamente detectable.</text>

  <!-- Credencial -->
  <line x1="1310" y1="380" x2="1310" y2="455" stroke="#C9A227" stroke-width="6" marker-end="url(#arw)"/>
  <text x="110" y="495" font-size="26" font-weight="bold" fill="#1F3864">2 · El informe se firma como credencial verificable</text>
  <g filter="url(#sh)"><rect x="110" y="520" rx="18" width="720" height="240" fill="url(#gold)"/></g>
  <rect x="110" y="520" rx="18" width="720" height="240" fill="none" stroke="#1F3864" stroke-width="3"/>
  <circle cx="205" cy="640" r="48" fill="#1F3864"/>
  <path d="M185 640 l14 14 l28 -30" fill="none" stroke="#C9A227" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="285" y="575" font-size="27" font-weight="bold" fill="#1F3864">CREDENCIAL W3C (Verifiable Credential)</text>
  <g font-size="22" fill="#3A3113">
    <text x="285" y="620">▪  Huella raíz de la cadena de evidencias</text>
    <text x="285" y="656">▪  Catálogo normativo: identificador y versión</text>
    <text x="285" y="692">▪  Perfil aplicado y alcance de la campaña</text>
    <text x="285" y="728">▪  Notarización en el marco Gaia-X (GXDCH)</text>
  </g>

  <!-- Verificadores -->
  <line x1="840" y1="640" x2="915" y2="640" stroke="#1F7A7A" stroke-width="6" marker-end="url(#arw)"/>
  <text x="930" y="495" font-size="26" font-weight="bold" fill="#1F3864">3 · Quién puede verificarla</text>
  <g filter="url(#sh)">
    <rect x="930" y="520" rx="14" width="590" height="70" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="930" y="605" rx="14" width="590" height="70" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
    <rect x="930" y="690" rx="14" width="590" height="70" fill="#F4F6FA" stroke="#1F3864" stroke-width="2"/>
  </g>
  <g font-size="22" fill="#26324A">
    <text x="960" y="563"><tspan font-weight="bold" fill="#1F3864">Auditor:</tspan>  comprueba que nada se alteró</text>
    <text x="960" y="648"><tspan font-weight="bold" fill="#1F3864">Autoridad de control:</tspan>  valida la integridad del expediente</text>
    <text x="960" y="733"><tspan font-weight="bold" fill="#1F3864">Socio de espacio de datos:</tspan>  la exige como condición de acceso</text>
  </g>

  <!-- Banda inferior -->
  <g filter="url(#sh)"><rect x="80" y="810" rx="16" width="1440" height="110" fill="#1F3864"/></g>
  <rect x="80" y="810" rx="16" width="14" height="110" fill="#C9A227"/>
  <text x="800" y="855" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">Integridad demostrable sin revelar contenido</text>
  <text x="800" y="893" text-anchor="middle" font-size="22" fill="#CFE0F5">El tercero verifica que las evidencias no han cambiado, sin necesidad de acceder a ellas: el cliente decide qué muestra, a quién y cuándo.</text>

  <text x="1560" y="975" text-anchor="end" font-size="16" fill="#9AA7BB">ARGOS · Software in a Box</text>
</svg>
