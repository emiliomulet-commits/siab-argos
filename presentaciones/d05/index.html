<script src="/presentaciones/assets/gsap.min.js"></script>
<script>
(function(){
const SCENES = ["Apertura", "Planteamiento", "Las sanciones suben", "El calendario corre", "Tres fuerzas", "ARGOS llena el hueco", "Cierre"];
const q = new URLSearchParams(location.search);
const VOZ = q.get("modo") === "video";
const WEB = q.get("modo") === "web" || VOZ;
document.body.classList.add(VOZ ? "video" : WEB ? "web" : "pres");
if(VOZ) document.querySelector("#start span").textContent = "▶ Ver con locución (sonido activado)";
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const cam = $("#cam"), C = {x:800, y:450, s:1};
const applyCam = () => cam.setAttribute("transform", `translate(${800 - C.x*C.s} ${450 - C.y*C.s}) scale(${C.s})`);
const camTo = (x, y, s, d=1.1, e="power3.inOut") => gsap.to(C, {x, y, s, duration:d, ease:e, onUpdate:applyCam});
function tw(el, dur){
  const full = el.getAttribute("data-full"), o = {n:0};
  return gsap.to(o, {n:full.length, duration:dur, ease:"none", onUpdate:() => { el.textContent = full.slice(0, Math.round(o.n)); }});
}
function prepDraw(p){ const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; return L; }
const draw = (p, d) => gsap.to(p, {strokeDashoffset:0, duration:d, ease:"power2.out"});
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " M€";

/* subrayado de «fechas exigibles» */
const sub = $("#sub"); sub.textContent = sub.getAttribute("data-full");
const W = "fechas exigibles", iD = sub.textContent.indexOf(W);
const ux = sub.getStartPositionOfChar(iD).x, uw = sub.getSubStringLength(iD, W.length);
$("#subline").setAttribute("x", ux); sub.textContent = "";

/* ---------- estado inicial */
applyCam();
const lids = $$("#introEye path"); lids.forEach(prepDraw);
prepDraw($("#tline")); prepDraw($("#hoyline"));
gsap.set("#introGlow", {scale:0, svgOrigin:"800 360"});
gsap.set("#introEye", {opacity:0});
gsap.set("#introEye .pupil", {scale:0, transformOrigin:"50% 50%"});
gsap.set(["#chip", "#pSan", "#pFz", "#pTl", "#pie", "#src", ".tick"], {opacity:0});
gsap.set("#chip", {x:-60});
gsap.set("#pSan", {x:-200}); gsap.set("#pFz", {x:200}); gsap.set("#pTl", {y:120});
gsap.set(".br", {scaleY:0, transformOrigin:"50% 100%"});
gsap.set(["#eu", ".eucap", ".gavel", "#tarrow", ".ya", "#spain", ".badge", ".cal"], {opacity:0});
gsap.set(".ms", {opacity:0, y:14});
gsap.set("#hoy rect, #hoy text", {opacity:0, y:-30});
gsap.set(".fz", {opacity:0, x:40});
gsap.set("#num", {opacity:0});

/* ---------- línea de tiempo (ritmo de anuncio, ~29 s) */
const tl = gsap.timeline({paused:true, defaults:{ease:"power3.out"}});
// 1 · Apertura
tl.addLabel("s1")
  .to("#introEye", {opacity:1, duration:.25}, "s1")
  .to("#introGlow", {scale:1, duration:.8, ease:"expo.out"}, "s1")
  .add(lids.map((p, i) => draw(p, .55).delay(i * .12)), "s1+=.1")
  .to("#introEye .pupil", {scale:1, duration:.45, ease:"back.out(3)"}, "s1+=.75")
  .add(tw($("#introT"), 1.2), "s1+=.9")
  .to({}, {duration:.3});
// 2 · Planteamiento
tl.addLabel("s2")
  .to("#intro", {y:-120, opacity:0, duration:.6, ease:"power2.in"}, "s2")
  .to("#chip", {x:0, opacity:1, duration:.5, ease:"back.out(2)"}, "s2+=.4")
  .add(tw($("#title"), .9), "s2+=.5")
  .add(tw($("#sub"), 1.1), "s2+=1.3")
  .to("#subline", {attr:{width:uw}, duration:.45, ease:"power2.inOut"}, "s2+=2.45")
  .to(".tick", {opacity:1, duration:.3}, "s2+=1.4")
  .fromTo(".tick path", {rotation:0, svgOrigin:"12 12"}, {rotation:360, duration:1.4, ease:"steps(12)"}, "s2+=1.5")
  .to({}, {duration:.3});
// 3 · Las sanciones suben
const cnt = {v:0};
tl.addLabel("s3")
  .add(camTo(390, 330, 1.55, 1), "s3")
  .to("#pSan", {x:0, opacity:1, duration:.7, ease:"expo.out"}, "s3+=.2")
  .to(".br", {scaleY:1, duration:.45, stagger:.22, ease:"back.out(1.6)"}, "s3+=.7")
  .set("#num", {opacity:1}, "s3+=.8")
  .fromTo(cnt, {v:0}, {v:7100, duration:1.7, ease:"power2.out", onUpdate:() => { $("#num").textContent = fmt(cnt.v); }}, "s3+=.8")
  .to(".gavel", {opacity:1, duration:.2}, "s3+=1.0")
  .fromTo(".gavel", {rotation:-25, transformOrigin:"50% 50%"}, {rotation:12, duration:.18, yoyo:true, repeat:3, ease:"power1.inOut"}, "s3+=1.05")
  .to("#eu", {opacity:1, duration:.4}, "s3+=2.2")
  .fromTo("#eu", {scale:.4, transformOrigin:"50% 50%"}, {scale:1, duration:.5, ease:"back.out(3)"}, "s3+=2.2")
  .to(".eucap", {opacity:1, duration:.4}, "s3+=2.5")
  .to(".bar:last-child .br", {fill:"#E04B3B", duration:.25, yoyo:true, repeat:3}, "s3+=2.3")
  .to({}, {duration:.5});
// 4 · El calendario corre
tl.addLabel("s4")
  .add(camTo(480, 670, 1.5, .9), "s4")
  .to("#pTl", {y:0, opacity:1, duration:.7, ease:"expo.out"}, "s4+=.1")
  .add(draw($("#tline"), 3.2).eventCallback("onStart", null), "s4+=.6")
  .to(".cal", {opacity:1, duration:.3}, "s4+=.6")
  .add(camTo(1120, 670, 1.5, 3.1, "power1.inOut"), "s4+=.8");
$$(".ms").forEach((m, i) => {
  const at = `s4+=${.75 + i * .62}`;
  tl.to(m, {opacity:1, y:0, duration:.4, ease:"back.out(2)"}, at)
    .fromTo(m.querySelector(".msring"), {opacity:.9, scale:.6, transformOrigin:"50% 50%"}, {opacity:0, scale:1.8, duration:.7, ease:"power2.out"}, at);
});
tl.to(".ya", {opacity:1, duration:.15, yoyo:true, repeat:4}, "s4+=2.1")
  .to("#tarrow", {opacity:1, duration:.3}, "s4+=3.7")
  .add(camTo(800, 665, 1.05, .8), "s4+=4.1")
  .to("#hoy rect, #hoy text", {opacity:1, y:0, duration:.45, ease:"bounce.out"}, "s4+=4.5")
  .add(draw($("#hoyline"), .5), "s4+=4.8")
  .to("#spain", {opacity:1, duration:.3}, "s4+=5.0")
  .to(".badge", {opacity:1, duration:.3, stagger:.15}, "s4+=5.1")
  .to({}, {duration:.5});
// 5 · Tres fuerzas
tl.addLabel("s5")
  .add(camTo(1130, 330, 1.42, 1), "s5")
  .to("#pFz", {x:0, opacity:1, duration:.7, ease:"expo.out"}, "s5+=.2")
  .to(".fz", {opacity:1, x:0, duration:.45, stagger:.55, ease:"back.out(1.8)"}, "s5+=.7")
  .to("#hole", {opacity:1, duration:.3}, "s5+=2.2")
  .fromTo("#hole", {strokeDashoffset:0}, {strokeDashoffset:-64, duration:1.6, ease:"none"}, "s5+=2.2")
  .to(".fz[data-i='2'] .fzi g", {stroke:"#E0675B", duration:.25, yoyo:true, repeat:3}, "s5+=2.3")
  .to({}, {duration:.4});
// 6 · ARGOS llena el hueco
tl.addLabel("s6")
  .add(camTo(800, 470, 1, 1), "s6")
  .to("#fill3", {opacity:1, duration:.4}, "s6+=.7")
  .fromTo("#fill3", {scale:.3, transformOrigin:"50% 50%"}, {scale:1, duration:.55, ease:"back.out(2.5)"}, "s6+=.7")
  .to("#hole", {stroke:"#C9A227", duration:.4}, "s6+=.9")
  .to(".fz[data-i='2'] .fzi g", {stroke:"#C9A227", duration:.3}, "s6+=.9")
  .to("#scan", {opacity:1, duration:.2}, "s6+=1.2")
  .fromTo("#scan", {attr:{x:140}}, {attr:{x:930}, duration:1.3, ease:"power1.inOut"}, "s6+=1.2")
  .to("#scan", {opacity:0, duration:.25}, "s6+=2.5")
  .to(".msdot", {scale:1.25, transformOrigin:"50% 50%", duration:.15, yoyo:true, repeat:1, stagger:.25}, "s6+=1.3")
  .add(tw($("#tag"), 1.5), "s6+=2.2")
  .to({}, {duration:.6});
// 7 · Cierre
tl.addLabel("s7")
  .to("#hole", {opacity:0, duration:.4}, "s7")
  .to(["#pie", "#src"], {opacity:1, duration:.5}, "s7+=.2")
  .to("#outro", {opacity:1, duration:.6}, "s7+=1.0")
  .fromTo("#outEye", {scale:.6, transformOrigin:"50% 50%"}, {scale:1, duration:.6, ease:"back.out(2)"}, "s7+=1.0")
  .to({}, {duration:1.5})
  .to("#outro", {opacity:0, duration:.6})
  .addLabel("end");

/* ---------- controles (idénticos al D01) */
const labels = SCENES.map((_, i) => tl.labels["s" + (i + 1)]).concat(tl.labels.end);
const sc = $("#scenes");
SCENES.forEach((n, i) => { const b = document.createElement("button"); b.innerHTML = `<b>${i + 1}</b><span>${n}</span><i></i>`; b.title = `${i + 1} · ${n}`; b.onclick = () => go(i); sc.appendChild(b); });
const sbtn = $$(".scenes button");
const cur = () => { const t = tl.time(); let k = 0; labels.forEach((l, i) => { if(i < SCENES.length && t >= l - .001) k = i; }); return k; };
let seg = null;
let vozOn = () => false;
function paint(){
  const t = tl.time(), k = cur();
  sbtn.forEach((b, i) => { b.classList.toggle("on", i === k); const a = labels[i], z = labels[i + 1]; b.querySelector("i").style.width = (t >= z ? 100 : t <= a ? 0 : (t - a) / (z - a) * 100) + "%"; });
  $("#pi").setAttribute("d", tl.isActive() || (seg && seg.isActive()) || vozOn() ? "M7 5h4v14H7zM13 5h4v14h-4z" : "M8 5v14l11-7z");
  document.body.classList.toggle("at-start", t < .01);
}
gsap.ticker.add(paint);
function stopSeg(){ if(seg){ seg.kill(); seg = null; } }
function go(i){
  stopSeg(); tl.pause(); i = Math.max(0, Math.min(SCENES.length - 1, i));
  tl.seek(labels[i], false);
  if(WEB){ tl.play(); return; }
  seg = tl.tweenFromTo(labels[i], labels[i + 1], {ease:"none"});
}
function next(){
  if(seg && seg.isActive()){ const k = cur(); stopSeg(); tl.seek(labels[k + 1], false); return; }
  const t = tl.time(), k = cur();
  if(t >= labels[SCENES.length] - .01) return;
  go(t - labels[k] < .02 ? k : k + 1);
}
function prev(){
  if(seg && seg.isActive()){ go(cur()); return; }
  const t = tl.time(), k = cur();
  go(t - labels[k] < .02 ? k - 1 : k);
}
function toggle(){
  if(WEB){ if(tl.time() >= tl.duration() - .01){ go(0); return; } tl.paused() ? tl.play() : tl.pause(); return; }
  if(seg && seg.isActive()){ seg.pause(); return; }
  if(seg && seg.paused() && seg.progress() < 1){ seg.resume(); return; }
  next();
}
$("#play").onclick = toggle; $("#next").onclick = next; $("#prev").onclick = prev;
$("#replay").onclick = () => go(0);
const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
$("#fs").onclick = fs;
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if(["ArrowRight", "PageDown", " "].includes(e.key)){ e.preventDefault(); next(); }
  else if(["ArrowLeft", "PageUp"].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key === "f" || e.key === "F") fs();
  else if(e.key === "h" || e.key === "H") document.body.classList.toggle("ui-off");
  else if(e.key === "Home") go(0);
  else if(/^[1-7]$/.test(e.key)) go(+e.key - 1);
});
if(!WEB) $("#wrap").addEventListener("click", next);

/* ---------- locución sincronizada (modo vídeo): [escena, desfase en la escena, segundo del audio] */
const SYNC = [["s1",0,0],["s2",0,2.5],["s3",0,7.4],["s3",.8,8.6],["s3",2.2,15.3],["s4",0,19.0],["s4",1.99,21.0],
  ["s4",2.61,27.6],["s4",3.23,30.5],["s4",4.5,31.0],["s5",0,32.1],["s5",1.8,35.4],["s5",2.2,36.0],["s6",0,40.6],["s6",2.2,42.8],["s7",0,46.4]]
  .map(([l, o, a]) => [a, tl.labels[l] + o]);
function a2t(a){
  for(let i = SYNC.length - 1; i >= 0; i--) if(a >= SYNC[i][0]){
    const [a0, t0] = SYNC[i], n = SYNC[i + 1];
    return Math.min(tl.duration(), n ? t0 + (a - a0) * (n[1] - t0) / (n[0] - a0) : t0 + (a - a0));
  }
  return 0;
}
const t2a = t => { let a = 0; SYNC.forEach(([sa, st]) => { if(st <= t + .001) a = sa; }); return a; };
let vozActiva = false, au = null;
function enableVoz(){
  if(vozActiva) return; vozActiva = true;
  au = new Audio("voz-d05.mp3"); au.preload = "auto";
  let endAt = null, run = false;
  const clock = () => endAt !== null ? au.duration + (performance.now() - endAt) / 1000 : au.currentTime;
  au.onended = () => { endAt = performance.now(); };
  vozOn = () => run;
  gsap.ticker.add(() => {
    if(!run) return;
    const t = a2t(clock()); tl.seek(t, false);
    if(t >= tl.duration() - .001){ run = false; endAt = null; }
  });
  const from = a => { tl.pause(); stopSeg(); endAt = null; au.currentTime = a; tl.seek(a2t(a), false); };
  const play = () => { au.play().catch(() => {}); run = true; };
  const pause = () => { au.pause(); run = false; };
  const tg = () => { if(run){ pause(); return; } if(tl.time() >= tl.duration() - .01 || endAt !== null){ from(0); } play(); };
  $("#play").onclick = tg; $("#start span").onclick = tg;
  $("#replay").onclick = () => { from(0); play(); };
  $("#next").onclick = () => { const k = cur(); if(k + 1 < SCENES.length){ from(t2a(labels[k + 1])); play(); } };
  $("#prev").onclick = () => { const k = cur(); from(t2a(labels[Math.max(0, k - (tl.time() - labels[k] < 1 ? 1 : 0))])); play(); };
  sbtn.forEach((b, i) => b.onclick = () => { from(t2a(labels[i])); play(); });
  $("#wrap").addEventListener("click", tg);
  document.addEventListener("keydown", e => {
    if(e.key === " "){ e.preventDefault(); e.stopImmediatePropagation(); tg(); }
    else if(e.key === "ArrowRight"){ e.stopImmediatePropagation(); $("#next").onclick(); }
    else if(e.key === "ArrowLeft"){ e.stopImmediatePropagation(); $("#prev").onclick(); }
    else if(/^[1-7]$/.test(e.key)){ e.stopImmediatePropagation(); sbtn[+e.key - 1].onclick(); }
  }, true);
  return {from, play};
}
if(VOZ && !reduced) enableVoz();

/* modo web: botón opcional de locución (arranca en silencio) */
const vb = $("#voz-btn");
if(WEB && !VOZ){
  vb.hidden = false;
  const pinta = () => { const on = vozActiva && !au.muted; vb.innerHTML = on ? "🔇 Silenciar" : "🔊 Activar locución"; vb.setAttribute("aria-pressed", on); };
  vb.onclick = e => {
    e.stopPropagation();
    if(!vozActiva){ document.body.classList.remove("reduced"); tl.pause(); const v = enableVoz(); v.from(0); v.play(); }
    else au.muted = !au.muted;
    pinta();
  };
  pinta();
}

if(reduced){
  document.body.classList.add("reduced");
  tl.seek(labels[SCENES.length - 1] + .9, false); gsap.set("#outro", {opacity:0});
  $("#rm-play").onclick = () => { document.body.classList.remove("reduced"); go(0); if(!WEB) tl.play(); };
} else if(WEB && !VOZ){
  const io = new IntersectionObserver(es => es.forEach(en => { if(vozActiva) return; if(en.isIntersecting && tl.time() === 0) tl.play(); else if(!en.isIntersecting) tl.pause(); }), {threshold:.4});
  io.observe($("#stage"));
}
let idleT; document.addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if(document.fullscreenElement) document.body.classList.add("idle"); }, 2500); });
window.D05 = {tl, go, a2t};
})();
</script>
</body>
