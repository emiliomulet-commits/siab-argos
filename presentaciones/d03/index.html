(function(){

const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));

const camTo = (x, y, s, d=1.1) => gsap.to(C, {x, y, s, duration:d, ease:"power3.inOut", onUpdate:applyCam});

function prepDraw(p){ const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; return L; }
const draw = (p, d) => gsap.to(p, {strokeDashoffset:0, duration:d, ease:"power2.out"});
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " M€";

/* ---------- estado inicial */

const lids = $$("#introEye path"); lids.forEach(prepDraw);
const arws = $$(".arw"); arws.forEach(prepDraw);
const sub = $("#sub"); sub.textContent = sub.getAttribute("data-full");
const iF = sub.textContent.indexOf("ficticia");
const ux = sub.getStartPositionOfChar(iF).x, uw = sub.getSubStringLength(iF, 8);

gsap.set(".fl", {scaleX:0, transformOrigin:"0% 50%"});
gsap.set("#ficha", {x:450, y:156, scale:.8});
gsap.set("#alert", {x:968, y:628});
gsap.set("#shield6", {x:428, y:416});

gsap.set(".arw", {opacity:0});
const bt = n => $(`#b${n} .bt`);
function boxIn(n, at){                      // entra una caja: aparece, se escribe el título y caen las líneas

}
const glowOff = (n, at) => tl.to(`#b${n} .bglow`, {opacity:0, duration:.4}, at);
function travel(n, at, d=.8){ tl.to("#ficha", {x:{1:450,2:950,3:1450,4:1450,5:950,6:450}[n], y:{1:156,2:156,3:156,4:438,5:438,6:438}[n], duration:d, ease:"power2.inOut"}, at); }

/* ---------- línea de tiempo (ritmo de anuncio, ~36 s) */
const tl = gsap.timeline({paused:true, defaults:{ease:"power3.out"}});
// 1 · Apertura

tl.addLabel("s2").add(camTo(300, 275, 1.75, 1), "s2");
boxIn(1, "s2+=.3");
tl.to("#ficha", {opacity:1, duration:.2}, "s2+=1.1")

  .to("#stamp", {opacity:1, duration:.1}, "s2+=2.2").from("#stamp rect, #stamp text", {scale:2.2, transformOrigin:"50% 50%", duration:.35, ease:"back.out(2)"}, "s2+=2.2")

// 3 · Introducción
tl.addLabel("s3").add(camTo(800, 275, 1.75, 1), "s3")

// 4 · Seguimiento
tl.addLabel("s4").add(camTo(1300, 275, 1.75, 1), "s4")
  .set("#a23", {opacity:1}, "s4").add(draw($("#a23"), .5), "s4+=.2");
glowOff(2, "s4");
travel(3, "s4+=.35");

tl.to('.ti[data-b="3"]', {opacity:1, duration:.25, stagger:.2}, "s4+=1.7");
[1408,1448,1488].forEach((tx, i) => {
  const c = `.copy[data-i="${i}"]`;
  tl.set(c, {x:1450, y:156, scale:.4, opacity:1}, `s4+=${2.0 + i * .3}`)
    .to(c, {x:tx, y:362, scale:.7, duration:.7, ease:"power2.inOut"}, `s4+=${2.0 + i * .3}`)
    .to(c, {opacity:0, scale:.3, duration:.25}, `s4+=${2.7 + i * .3}`)
    .fromTo(`.ti[data-b="3"][data-i="${i}"]`, {scale:1}, {scale:1.35, transformOrigin:"50% 50%", duration:.15, yoyo:true, repeat:1}, `s4+=${2.7 + i * .3}`);
});
tl.to({}, {duration:.5});
// 5 · Ejercicio de derechos
tl.addLabel("s5").to(".copy", {opacity:0, duration:.3}, "s5").add(camTo(1300, 557, 1.75, .9), "s5")
  .set("#a34", {opacity:1}, "s5").add(draw($("#a34"), .45), "s5+=.2");
glowOff(3, "s5");
travel(4, "s5+=.3");
boxIn(4, "s5+=.45");
tl.to('.ti[data-b="4"]', {opacity:1, duration:.25, stagger:.3}, "s5+=1.8")
  .fromTo('.ti[data-b="4"]', {scale:.4, transformOrigin:"50% 50%"}, {scale:1, duration:.4, stagger:.3, ease:"back.out(3)"}, "s5+=1.8")
  .to('.ti[data-b="4"][data-i="1"] line:nth-of-type(2)', {rotation:360, svgOrigin:"12 14", duration:1.6, ease:"none"}, "s5+=2.4")
  .to({}, {duration:.3});
// 6 · Verificación de borrado
tl.addLabel("s6").add(camTo(800, 557, 1.75, .9), "s6")
  .set("#a45", {opacity:1}, "s6").add(draw($("#a45"), .45), "s6+=.2");
glowOff(4, "s6");
travel(5, "s6+=.3");
boxIn(5, "s6+=.45");
tl.to("#scan", {opacity:1, duration:.2}, "s6+=1.8")
  .fromTo("#scan", {attr:{x:520}}, {attr:{x:1020}, duration:1.4, ease:"power1.inOut"}, "s6+=1.8")
  .to("#scan", {opacity:0, duration:.2}, "s6+=3.2")
  .to("#fichaRed", {opacity:1, duration:.15, yoyo:true, repeat:3}, "s6+=3.0")
  .to("#alert", {opacity:1, duration:.25}, "s6+=3.1")
  .fromTo("#alert", {scale:.3, transformOrigin:"50% 50%"}, {scale:1, duration:.4, ease:"back.out(4)"}, "s6+=3.1")
  .to("#b5 .bbg", {stroke:"#C0392B", duration:.2, yoyo:true, repeat:1}, "s6+=3.1")
  .to({}, {duration:.4});
// 7 · Eliminación verificada
tl.addLabel("s7").add(camTo(300, 557, 1.75, .9), "s7")
  .set("#a56", {opacity:1}, "s7").add(draw($("#a56"), .45), "s7+=.2");
glowOff(5, "s7");
travel(6, "s7+=.3");
boxIn(6, "s7+=.45");
tl.to("#fichaIn", {scale:.2, opacity:0, duration:.6, ease:"back.in(2)", transformOrigin:"50% 50%"}, "s7+=1.9")
  .to("#shield6", {opacity:1, duration:.25}, "s7+=2.5")
  .fromTo("#shield6", {scale:.3, transformOrigin:"50% 50%"}, {scale:1, duration:.5, ease:"back.out(3)"}, "s7+=2.5")
  .to({}, {duration:.5});
// 8 · Cierre
tl.addLabel("s8").add(camTo(800, 450, 1, 1.1), "s8");
glowOff(6, "s8");
tl.to("#band", {y:0, opacity:1, duration:.6, ease:"expo.out"}, "s8+=.5")
  .add(tw($("#finT"), .9), "s8+=.8")
  .add(tw($("#fin1"), 1.3), "s8+=1.6")
  .to(".lk", {scale:1, duration:.4, stagger:.35, ease:"back.out(3)"}, "s8+=2.3")
  .to("#lkl", {opacity:1, duration:.3}, "s8+=2.6")
  .to(["#pie", "#nota"], {opacity:1, duration:.5}, "s8+=2.4")
  .to(".box .bglow", {opacity:1, duration:.15, stagger:.1}, "s8+=3.0")
  .to(".box .bglow", {opacity:0, duration:.4, stagger:.06}, "s8+=3.8")
  .to("#outro", {opacity:1, duration:.6}, "s8+=4.6")
  .fromTo("#outEye", {scale:.6, transformOrigin:"50% 50%"}, {scale:1, duration:.6, ease:"back.out(2)"}, "s8+=4.6")
  .to({}, {duration:1.6})
  .to("#outro", {opacity:0, duration:.6})
  .addLabel("end");

/* ---------- controles */
const labels = SCENES.map((_, i) => tl.labels["s" + (i + 1)]).concat(tl.labels.end);
const sc = $("#scenes");
SCENES.forEach((n, i) => { const b = document.createElement("button"); b.innerHTML = `<b>${i + 1}</b><span>${n}</span><i></i>`; b.title = `${i + 1} · ${n}`; b.onclick = () => go(i); sc.appendChild(b); });
const sbtn = $$(".scenes button");
const cur = () => { const t = tl.time(); let k = 0; labels.forEach((l, i) => { if(i < SCENES.length && t >= l - .001) k = i; }); return k; };
function paint(){
  const t = tl.time(), k = cur();
  sbtn.forEach((b, i) => { b.classList.toggle("on", i === k); const a = labels[i], z = labels[i + 1]; b.querySelector("i").style.width = (t >= z ? 100 : t <= a ? 0 : (t - a) / (z - a) * 100) + "%"; });
  $("#pi").setAttribute("d", tl.isActive() || (seg && seg.isActive()) || (window.D03 && D03.vozOn && D03.vozOn()) ? "M7 5h4v14H7zM13 5h4v14h-4z" : "M8 5v14l11-7z");
  document.body.classList.toggle("at-start", t < .01);
  document.body.classList.toggle("at-end", t >= tl.duration() - .05);
}
gsap.ticker.add(paint);
let seg = null;
function stopSeg(){ if(seg){ seg.kill(); seg = null; } }
function go(i){                     // ir al principio de la escena i y reproducirla
  stopSeg(); tl.pause(); i = Math.max(0, Math.min(SCENES.length - 1, i));
  tl.seek(labels[i], false);
  if(WEB){ tl.play(); return; }
  seg = tl.tweenFromTo(labels[i], labels[i + 1], {ease:"none"});
}
function next(){
  if(seg && seg.isActive()){ const k = cur(); stopSeg(); tl.seek(labels[k + 1], false); return; }   // terminar la escena en curso
  const t = tl.time(), k = cur();
  if(t >= labels[SCENES.length] - .01) return;
  go(t - labels[k] < .02 ? k : k + 1);
}
function prev(){
  if(seg && seg.isActive()){ go(cur()); return; }
  const t = tl.time(), k = cur();
  go(t - labels[k] < .02 ? k - 1 : k);
}
function toggle(){
  if(WEB){ if(tl.time() >= tl.duration() - .01){ go(0); return; } tl.paused() ? tl.play() : tl.pause(); return; }
  if(seg && seg.isActive()){ seg.pause(); return; }
  if(seg && seg.paused() && seg.progress() < 1){ seg.resume(); return; }
  next();
}
$("#play").onclick = toggle; $("#next").onclick = next; $("#prev").onclick = prev;
$("#replay").onclick = () => go(0);
const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
$("#fs").onclick = fs;
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if(["ArrowRight", "PageDown", " "].includes(e.key)){ e.preventDefault(); next(); }
  else if(["ArrowLeft", "PageUp"].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key === "f" || e.key === "F") fs();
  else if(e.key === "h" || e.key === "H") document.body.classList.toggle("ui-off");
  else if(e.key === "Home") go(0);
  else if(/^[1-8]$/.test(e.key)) go(+e.key - 1);
});
if(!WEB) $("#wrap").addEventListener("click", next);


/* ---------- locución sincronizada (modo vídeo): [escena, desfase en la escena, segundo del audio] */
const ANCH = [["s1", 0, 0], ["s2", 0, 2.6], ["s3", 0, 10.4], ["s4", 0, 14.7], ["s5", 0, 20.2], ["s6", 0, 24.7], ["s7", 0, 30.4], ["s8", 0, 35.4], ["s8", 6.8, 40.9]].map(([l, o, a]) => [a, tl.labels[l] + o]);
const SYNC = [];
ANCH.forEach(([a, t], i) => {
  SYNC.push([a, t]);
  const n = ANCH[i + 1]; if(!n) return;
  const dt = n[1] - t, da = n[0] - a;
  if(da > dt + .1) SYNC.push([a + dt - .05, n[1] - .05]);      // la animación va a 1x y espera a la voz
});
function a2t(a){
  for(let i = SYNC.length - 1; i >= 0; i--) if(a >= SYNC[i][0]){
    const [a0, t0] = SYNC[i], n = SYNC[i + 1];
    return Math.min(tl.duration(), n ? t0 + (a - a0) * (n[1] - t0) / (n[0] - a0) : t0 + (a - a0));
  }
  return 0;
}
const t2a = t => { let a = 0; SYNC.forEach(([sa, st]) => { if(st <= t + .001) a = sa; }); return a; };
let vozOn = () => false;
let vozActiva = false, au = null;
function enableVoz(){
  if(vozActiva) return; vozActiva = true;
  au = new Audio("voz-d03.mp3"); au.preload = "auto"; run = false;
  const clock = () => endAt !== null ? au.duration + (performance.now() - endAt) / 1000 : au.currentTime;
  au.onended = () => { endAt = performance.now(); };
  vozOn = () => run;
  gsap.ticker.add(() => {
    if(!run) return;
    const t = a2t(clock()); tl.seek(t, false);
    if(t >= tl.duration() - .001){ run = false; endAt = null; }
  });
  const from = a => { tl.pause(); stopSeg(); endAt = null; au.currentTime = a; tl.seek(a2t(a), false); };
  const play = () => { au.play().catch(() => {}); run = true; };
  const pause = () => { au.pause(); run = false; };
  const tg = () => { if(run){ pause(); return; } if(tl.time() >= tl.duration() - .01 || endAt !== null){ from(0); } play(); };
  $("#play").onclick = tg; $("#start span").onclick = tg;
  $("#replay").onclick = () => { from(0); play(); };
  $("#next").onclick = () => { const k = cur(); if(k + 1 < SCENES.length){ from(t2a(labels[k + 1])); play(); } };
  $("#prev").onclick = () => { const k = cur(); from(t2a(labels[Math.max(0, k - (tl.time() - labels[k] < 1 ? 1 : 0))])); play(); };
  sbtn.forEach((b, i) => b.onclick = () => { from(t2a(labels[i])); play(); });
  $("#wrap").addEventListener("click", tg);
  document.addEventListener("keydown", e => {
    if(e.key === " "){ e.preventDefault(); e.stopImmediatePropagation(); tg(); }
    else if(e.key === "ArrowRight"){ e.stopImmediatePropagation(); $("#next").onclick(); }
    else if(e.key === "ArrowLeft"){ e.stopImmediatePropagation(); $("#prev").onclick(); }
    else if(/^[1-9]$/.test(e.key) && sbtn[+e.key - 1]){ e.stopImmediatePropagation(); sbtn[+e.key - 1].onclick(); }
  }, true);
  return {from, play};
}
if(VOZ && !reduced) enableVoz();

/* modo web: botón opcional de locución (arranca en silencio) */
const vb = $("#voz-btn");
if(WEB && !VOZ && !q.get("render")){
  vb.hidden = false;
  const pinta = () => { const on = vozActiva && !au.muted; vb.textContent = on ? "🔇 Silenciar" : "🔊 Activar locución"; vb.setAttribute("aria-pressed", on); };
  vb.onclick = e => {
    e.stopPropagation();
    if(!vozActiva){ document.body.classList.remove("reduced"); tl.pause(); const v = enableVoz(); v.from(0); v.play(); }
    else au.muted = !au.muted;
    pinta();
  };
  pinta();
}
/* modo web: arranca al verse; el ratón quieto oculta los controles en pantalla completa */
if(reduced){
  document.body.classList.add("reduced");
  tl.seek(tl.labels.end, false); gsap.set("#outro", {opacity:0});
  $("#rm-play").onclick = () => { document.body.classList.remove("reduced"); go(0); if(!WEB) tl.play(); };
} else if(WEB && !VOZ){
  const io = new IntersectionObserver(es => es.forEach(en => { if(vozActiva) return; if(en.isIntersecting && tl.time() === 0) tl.play(); else if(!en.isIntersecting) tl.pause(); }), {threshold:.4});
  io.observe($("#stage"));
}
let idleT; document.addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if(document.fullscreenElement) document.body.classList.add("idle"); }, 2500); });
window.D03 = {tl, go, a2t, vozOn:() => vozOn()};
})();
</script>
