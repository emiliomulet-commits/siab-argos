<script>
(function(){
const SCENES = ["Apertura", "Planteamiento", "Lo declarado", "Lo efectivo", "La brecha", "ARGOS cierra la brecha", "Cierre"];
const q = new URLSearchParams(location.search);
const VOZ = q.get("modo") === "video";
const WEB = q.get("modo") === "web" || VOZ;
document.body.classList.add(VOZ ? "video" : WEB ? "web" : "pres");
if(q.get("embed")) document.body.classList.add("embed");
if(VOZ) document.querySelector("#start span").textContent = "▶ Ver con locución (sonido activado)";
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- utilidades */
const cam = $("#cam"), C = {x:800, y:450, s:1};
const applyCam = () => cam.setAttribute("transform", `translate(${800 - C.x*C.s} ${450 - C.y*C.s}) scale(${C.s})`);
const camTo = (x, y, s, d=1.1) => gsap.to(C, {x, y, s, duration:d, ease:"power3.inOut", onUpdate:applyCam});
function tw(el, dur){                       // máquina de escribir
  const full = el.getAttribute("data-full"), o = {n:0};
  return gsap.to(o, {n:full.length, duration:dur, ease:"none", onUpdate:() => { el.textContent = full.slice(0, Math.round(o.n)); }});
}
function prepDraw(p){ const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; return L; }
const draw = (p, d) => gsap.to(p, {strokeDashoffset:0, duration:d, ease:"power2.out"});
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " M€";

/* subrayado de «distancia» */
const sub = $("#sub"); sub.textContent = sub.getAttribute("data-full");
const iD = sub.textContent.indexOf("distancia");
const ux = sub.getStartPositionOfChar(iD).x, uw = sub.getSubStringLength(iD, 9);
$("#subline").setAttribute("x", ux); sub.textContent = "";

/* ---------- estado inicial */
applyCam();
const lids = $$("#introEye path"); lids.forEach(prepDraw);
[$("#a1"), $("#a2")].forEach(prepDraw);
gsap.set("#introGlow", {scale:0, svgOrigin:"800 360"});
gsap.set("#introEye", {opacity:0});
gsap.set("#introEye .pupil", {scale:0, transformOrigin:"50% 50%"});
gsap.set(["#chip", "#pDecl", "#pEfec", "#gap", "#band", "#pie", "#src"], {opacity:0});
gsap.set("#chip", {x:-60});
gsap.set("#pDecl", {x:-260}); gsap.set("#pEfec", {x:260});
gsap.set(".cd, .ce", {opacity:0, y:-30});
gsap.set("#gap", {scale:.6, svgOrigin:"800 390"});
gsap.set(["#a1", "#a2"], {opacity:0});
gsap.set(["#eu", ".badge", ".gavel", "#spain"], {opacity:0});
gsap.set("#band", {y:60});
gsap.set(".dot", {opacity:0});

/* puntos de actividad en los sistemas: bucle independiente */
const dotsLoop = gsap.timeline({repeat:-1, paused:true});
$$(".dot").forEach((d, i) => {
  dotsLoop.fromTo(d, {attr:{cx:1048}}, {attr:{cx:1472}, duration:1.6, ease:"none"}, i * .35)
          .fromTo(d, {opacity:0}, {opacity:1, duration:.3}, i * .35)
          .to(d, {opacity:0, duration:.3}, i * .35 + 1.3);
});

/* ---------- línea de tiempo (ritmo de anuncio, ~32 s) */
const tl = gsap.timeline({paused:true, defaults:{ease:"power3.out"}});
// 1 · Apertura
tl.addLabel("s1")
  .to("#introEye", {opacity:1, duration:.25}, "s1")
  .to("#introGlow", {scale:1, duration:.8, ease:"expo.out"}, "s1")
  .add(() => {}, "s1")
  .add(lids.map((p, i) => draw(p, .55).delay(i * .12)), "s1+=.1")
  .to("#introEye .pupil", {scale:1, duration:.45, ease:"back.out(3)"}, "s1+=.75")
  .add(tw($("#introT"), 1.1), "s1+=.9")
  .to({}, {duration:.4});
// 2 · Planteamiento
tl.addLabel("s2")
  .to("#intro", {y:-120, opacity:0, duration:.6, ease:"power2.in"}, "s2")
  .to("#chip", {x:0, opacity:1, duration:.5, ease:"back.out(2)"}, "s2+=.4")
  .add(tw($("#title"), .8), "s2+=.5")
  .add(tw($("#sub"), 1.1), "s2+=1.25")
  .to("#subline", {attr:{width:uw}, duration:.45, ease:"power2.inOut"}, "s2+=2.45")
  .to({}, {duration:.35});
// 3 · Lo declarado
tl.addLabel("s3")
  .add(camTo(340, 390, 1.45, 1), "s3")
  .to("#pDecl", {x:0, opacity:1, duration:.7, ease:"expo.out"}, "s3+=.2");
$$(".cd").forEach((c, i) => {
  const at = `s3+=${.8 + i * .5}`;
  tl.to(c, {y:0, opacity:1, duration:.4, ease:"back.out(2.2)"}, at)
    .to(c.querySelector(".cardglow"), {opacity:1, duration:.15}, at)
    .to(c.querySelector(".cardglow"), {opacity:0, duration:.4}, `${at}+.35`);
});
tl.to(".cd .cardbg", {fill:"#EEF1F6", duration:.4}, "s3+=3.1").to({}, {duration:.5});
// 4 · Lo efectivo
tl.addLabel("s4")
  .add(camTo(1260, 390, 1.45, 1), "s4")
  .to("#pEfec", {x:0, opacity:1, duration:.7, ease:"expo.out"}, "s4+=.2");
$$(".ce").forEach((c, i) => {
  const at = `s4+=${.8 + i * .5}`;
  tl.to(c, {y:0, opacity:1, duration:.4, ease:"back.out(2.2)"}, at)
    .to(c.querySelector(".cardglow"), {opacity:1, duration:.15}, at)
    .to(c.querySelector(".cardglow"), {opacity:0, duration:.4}, `${at}+.35`);
});
tl.add(() => dotsLoop.play(), "s4+=1.2").to({}, {duration:.9});
// 5 · La brecha
const cnt = {v:0};
tl.addLabel("s5")
  .add(camTo(800, 400, 1.1, .9), "s5")
  .to("#pDecl", {x:-24, duration:.6}, "s5+=.2").to("#pEfec", {x:24, duration:.6}, "s5+=.2")
  .to("#gap", {opacity:1, scale:1, duration:.6, ease:"back.out(1.8)"}, "s5+=.4")
  .to(".gavel", {opacity:1, duration:.2}, "s5+=.8")
  .fromTo(".gavel", {rotation:-25, transformOrigin:"50% 50%"}, {rotation:12, duration:.18, yoyo:true, repeat:3, ease:"power1.inOut"}, "s5+=.85")
  .fromTo(cnt, {v:0}, {v:7100, duration:1.6, ease:"power2.out", onUpdate:() => { $("#num").textContent = fmt(cnt.v); }}, "s5+=1.2")
  .to("#eu", {opacity:1, duration:.4}, "s5+=1.4")
  .fromTo("#eu", {scale:.4, svgOrigin:"799.5 227"}, {scale:1, duration:.5, ease:"back.out(3)"}, "s5+=1.4")
  .fromTo("#gapbox", {strokeDashoffset:0}, {strokeDashoffset:-72, duration:1.6, ease:"none"}, "s5+=.4")
  .to("#gapbox", {fill:"#F9D6D3", duration:.3, yoyo:true, repeat:3}, "s5+=2.9")
  .to("#spain", {opacity:1, duration:.3}, "s5+=3.1")
  .to(".badge", {opacity:1, duration:.35, stagger:.15}, "s5+=3.2")
  .to({}, {duration:.6});
// 6 · ARGOS cierra la brecha
tl.addLabel("s6")
  .add(camTo(800, 470, 1, 1), "s6")
  .set(["#a1", "#a2"], {opacity:1}, "s6+=.5").add(draw($("#a1"), .6), "s6+=.5").add(draw($("#a2"), .6), "s6+=.6")
  .to("#band", {y:0, opacity:1, duration:.6, ease:"expo.out"}, "s6+=.9")
  .add(tw($("#finT"), .7), "s6+=1.3")
  .to("#scan", {opacity:1, duration:.2}, "s6+=1.6")
  .fromTo("#scan", {attr:{x:70}}, {attr:{x:1470}, duration:1.6, ease:"power1.inOut"}, "s6+=1.6")
  .to("#scan", {opacity:0, duration:.25}, "s6+=3.2")
  .to(".cd .cardglow, .ce .cardglow", {opacity:1, stroke:"#C9A227", duration:.12, stagger:.08}, "s6+=1.7")
  .to(".cd .cardglow, .ce .cardglow", {opacity:0, duration:.4, stagger:.05}, "s6+=2.8")
  .to("#gap", {scale:.15, opacity:0, duration:.6, ease:"back.in(1.6)"}, "s6+=3.0")
  .to("#pDecl", {x:0, duration:.6}, "s6+=3.1").to("#pEfec", {x:0, duration:.6}, "s6+=3.1")
  .add(tw($("#fin1"), 1.1), "s6+=2.0")
  .add(tw($("#fin2"), 1.1), "s6+=3.1")
  .to(".shield", {opacity:1, duration:.3}, "s6+=3.9")
  .fromTo(".shield", {scale:.3, transformOrigin:"50% 50%"}, {scale:1, duration:.5, ease:"back.out(3)"}, "s6+=3.9")
  .to({}, {duration:.7});
// 7 · Cierre
tl.addLabel("s7")
  .to("#gap", {scale:1, opacity:1, duration:.6, ease:"back.out(1.6)"}, "s7")
  .to(["#pie", "#src"], {opacity:1, duration:.5}, "s7+=.3")
  .to("#outro", {opacity:1, duration:.6}, "s7+=1.2")
  .fromTo("#outEye", {scale:.6, transformOrigin:"50% 50%"}, {scale:1, duration:.6, ease:"back.out(2)"}, "s7+=1.2")
  .to({}, {duration:1.6})
  .to("#outro", {opacity:0, duration:.6})
  .addLabel("end");
gsap.set(".shield", {opacity:0});

/* ---------- controles */
const labels = SCENES.map((_, i) => tl.labels["s" + (i + 1)]).concat(tl.labels.end);
const sc = $("#scenes");
SCENES.forEach((n, i) => { const b = document.createElement("button"); b.innerHTML = `<b>${i + 1}</b><span>${n}</span><i></i>`; b.title = `${i + 1} · ${n}`; b.onclick = () => go(i); sc.appendChild(b); });
const sbtn = $$(".scenes button");
const cur = () => { const t = tl.time(); let k = 0; labels.forEach((l, i) => { if(i < SCENES.length && t >= l - .001) k = i; }); return k; };
function paint(){
  const t = tl.time(), k = cur();
  sbtn.forEach((b, i) => { b.classList.toggle("on", i === k); const a = labels[i], z = labels[i + 1]; b.querySelector("i").style.width = (t >= z ? 100 : t <= a ? 0 : (t - a) / (z - a) * 100) + "%"; });
  $("#pi").setAttribute("d", tl.isActive() || (seg && seg.isActive()) || (window.D01 && D01.vozOn && D01.vozOn()) ? "M7 5h4v14H7zM13 5h4v14h-4z" : "M8 5v14l11-7z");
  document.body.classList.toggle("at-start", t < .01);
}
gsap.ticker.add(paint);
let seg = null;
function stopSeg(){ if(seg){ seg.kill(); seg = null; } }
function go(i){                     // ir al principio de la escena i y reproducirla
  stopSeg(); tl.pause(); i = Math.max(0, Math.min(SCENES.length - 1, i));
  if(i < 3 || i > 3) dotsLoop.pause();
  tl.seek(labels[i], false);
  if(i >= 3) dotsLoop.play();
  if(WEB){ tl.play(); return; }
  seg = tl.tweenFromTo(labels[i], labels[i + 1], {ease:"none"});
}
function next(){
  if(seg && seg.isActive()){ const k = cur(); stopSeg(); tl.seek(labels[k + 1], false); return; }   // terminar la escena en curso
  const t = tl.time(), k = cur();
  if(t >= labels[SCENES.length] - .01) return;
  go(t - labels[k] < .02 ? k : k + 1);
}
function prev(){
  if(seg && seg.isActive()){ go(cur()); return; }
  const t = tl.time(), k = cur();
  go(t - labels[k] < .02 ? k - 1 : k);
}
function toggle(){
  if(WEB){ if(tl.time() >= tl.duration() - .01){ go(0); return; } tl.paused() ? tl.play() : tl.pause(); return; }
  if(seg && seg.isActive()){ seg.pause(); return; }
  if(seg && seg.paused() && seg.progress() < 1){ seg.resume(); return; }
  next();
}
$("#play").onclick = toggle; $("#next").onclick = next; $("#prev").onclick = prev;
$("#replay").onclick = () => go(0);
const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
$("#fs").onclick = fs;
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if(["ArrowRight", "PageDown", " "].includes(e.key)){ e.preventDefault(); next(); }
  else if(["ArrowLeft", "PageUp"].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key === "f" || e.key === "F") fs();
  else if(e.key === "h" || e.key === "H") document.body.classList.toggle("ui-off");
  else if(e.key === "Home") go(0);
  else if(/^[1-7]$/.test(e.key)) go(+e.key - 1);
});
if(!WEB) $("#wrap").addEventListener("click", next);


/* ---------- locución sincronizada (modo vídeo): [escena, desfase en la escena, segundo del audio] */
const SYNC = [["s1",0,0],["s2",0,2.0],["s3",0,4.28],["s4",0,5.44],["s5",0,9.56],["s5",.4,9.9],["s5",1.2,11.74],["s5",2.8,13.4],
  ["s5",3.1,20.5],["s5",3.2,21.8],["s5",3.35,24.6],["s6",0,27.2],["s7",0,31.7]].map(([l, o, a]) => [a, tl.labels[l] + o]);
function a2t(a){
  for(let i = SYNC.length - 1; i >= 0; i--) if(a >= SYNC[i][0]){
    const [a0, t0] = SYNC[i], n = SYNC[i + 1];
    return Math.min(tl.duration(), n ? t0 + (a - a0) * (n[1] - t0) / (n[0] - a0) : t0 + (a - a0));
  }
  return 0;
}
const t2a = t => { let a = 0; SYNC.forEach(([sa, st]) => { if(st <= t + .001) a = sa; }); return a; };
let vozOn = () => false;
let vozActiva = false, au = null;
function enableVoz(){
  if(vozActiva) return; vozActiva = true;
  au = new Audio("voz-d01.mp3"); au.preload = "auto";
  let endAt = null, run = false;
  const clock = () => endAt !== null ? au.duration + (performance.now() - endAt) / 1000 : au.currentTime;
  au.onended = () => { endAt = performance.now(); };
  vozOn = () => run;
  gsap.ticker.add(() => {
    if(!run) return;
    const t = a2t(clock()); tl.seek(t, false);
    if(t >= tl.duration() - .001){ run = false; endAt = null; }
  });
  const from = a => { tl.pause(); stopSeg(); dotsLoop.pause(); endAt = null; au.currentTime = a; tl.seek(a2t(a), false); if(a2t(a) >= labels[3]) dotsLoop.play(); };
  const play = () => { run = true; return au.play().catch(() => { run = false; }); };
  const pause = () => { au.pause(); run = false; };
  const tg = () => { if(run){ pause(); return; } if(tl.time() >= tl.duration() - .01 || endAt !== null){ from(0); } play(); };
  $("#play").onclick = tg; $("#start span").onclick = tg;
  $("#replay").onclick = () => { from(0); play(); };
  $("#next").onclick = () => { const k = cur(); if(k + 1 < SCENES.length){ from(t2a(labels[k + 1])); play(); } };
  $("#prev").onclick = () => { const k = cur(); from(t2a(labels[Math.max(0, k - (tl.time() - labels[k] < 1 ? 1 : 0))])); play(); };
  sbtn.forEach((b, i) => b.onclick = () => { from(t2a(labels[i])); play(); });
  $("#wrap").addEventListener("click", tg);
  document.addEventListener("keydown", e => {
    if(e.key === " "){ e.preventDefault(); e.stopImmediatePropagation(); tg(); }
    else if(e.key === "ArrowRight"){ e.stopImmediatePropagation(); $("#next").onclick(); }
    else if(e.key === "ArrowLeft"){ e.stopImmediatePropagation(); $("#prev").onclick(); }
    else if(/^[1-7]$/.test(e.key)){ e.stopImmediatePropagation(); sbtn[+e.key - 1].onclick(); }
  }, true);
  return {from, play};
}
if(VOZ && !reduced){ const v = enableVoz(); if(q.get("auto") === "1"){ v.from(0); v.play(); } } /* auto=1: arranca con sonido si el navegador lo permite; si no, espera el clic */
/* dentro de la web (ventana emergente): avisa al terminar para cerrarse y volver al punto de partida */
/* barra estrecha: la fila de escenas no se desborda sobre los botones */
(() => { const st = document.createElement("style"); st.textContent = ".scenes{overflow:hidden}@media(max-width:520px){.scenes{display:none}}"; document.head.appendChild(st); })();
if(window.parent !== window && (WEB || VOZ) && new URLSearchParams(location.search).get("embed") !== "1"){
  /* barra inferior: botón de cerrar (y Esc) que cierra la ventana emergente de la web */
  const cerrarLb = () => { try { window.parent.postMessage({argos: "cerrar"}, "*"); } catch(e){} };
  const fsb = document.getElementById("fs");
  if(fsb && !document.getElementById("cerrar-lb")){
    const cb = document.createElement("button"); cb.id = "cerrar-lb"; cb.type = "button";
    cb.setAttribute("aria-label", "Cerrar (Esc)"); cb.title = "Cerrar (Esc)";
    cb.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    cb.style.cssText = "border-color:#C9A227;color:#C9A227";
    cb.addEventListener("click", e => { e.stopPropagation(); cerrarLb(); });
    fsb.parentNode.appendChild(cb);
  }
  document.addEventListener("keydown", e => { if(e.key === "Escape" && !document.fullscreenElement) cerrarLb(); });
  /* el primer botón es Reproducir/Pausa: lo indicamos al pasar el ratón */
  const pb = document.getElementById("play");
  if(pb) gsap.ticker.add(() => { const pausa = (document.getElementById("pi") || {}).getAttribute?.("d")?.startsWith("M7 5h4"); const t = pausa ? "Pausa (espacio)" : "Reproducir (espacio)"; if(pb.title !== t){ pb.title = t; pb.setAttribute("aria-label", t); } });
}
if(window.parent !== window && (WEB || VOZ)){
  let armado = false, avisado = false;
  gsap.ticker.add(() => {
    const t = tl.time(), d = tl.duration();
    if(t > .3 && t < d - 1) { armado = true; avisado = false; }
    if(armado && !avisado && t >= d - .05){ avisado = true; armado = false; try { window.parent.postMessage({argos: "fin"}, "*"); } catch(e){} }
  });
}

/* modo web: botón opcional de locución (arranca en silencio) */
const vb = $("#voz-btn");
if(WEB && !VOZ && !q.get("render")){
  vb.hidden = false;
  const pinta = () => { const on = vozActiva && !au.muted; vb.textContent = on ? "🔇 Silenciar" : "🔊 Activar locución"; vb.setAttribute("aria-pressed", on); };
  vb.onclick = e => {
    e.stopPropagation();
    if(!vozActiva){ document.body.classList.remove("reduced"); tl.pause(); const v = enableVoz(); v.from(0); v.play(); }
    else au.muted = !au.muted;
    pinta();
  };
  pinta();
}

/* modo web: arranca al verse; el ratón quieto oculta los controles en pantalla completa */
if(reduced){
  document.body.classList.add("reduced");
  tl.seek(labels[SCENES.length - 1] + 1.1, false); gsap.set("#outro", {opacity:0});
  $("#rm-play").onclick = () => { document.body.classList.remove("reduced"); go(0); if(!WEB) tl.play(); };
} else if(WEB && !VOZ){
  const io = new IntersectionObserver(es => es.forEach(en => { if(vozActiva) return; if(en.isIntersecting && tl.time() === 0) tl.play(); else if(!en.isIntersecting) tl.pause(); }), {threshold:.4});
  io.observe($("#stage"));
}
let idleT; document.addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if(document.fullscreenElement) document.body.classList.add("idle"); }, 2500); });
window.D01 = {tl, go, a2t, dots:dotsLoop, vozOn:() => vozOn()};
})();
</script>
