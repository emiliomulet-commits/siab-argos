<script>
(function(){
const SCENES = ["Apertura", "La campaña", "Informe y plan", "RoPA y DPIA", "La credencial", "La comprueba un tercero", "Cierre"];
const q = new URLSearchParams(location.search);
const WEB = q.get("modo") === "web";
document.body.classList.add(WEB ? "web" : "pres");
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- utilidades */
const cam = $("#cam"), C = {x:800, y:450, s:1};
const applyCam = () => cam.setAttribute("transform", `translate(${800 - C.x*C.s} ${450 - C.y*C.s}) scale(${C.s})`);
const camTo = (x, y, s, d=1.1) => gsap.to(C, {x, y, s, duration:d, ease:"power3.inOut", onUpdate:applyCam});
function tw(el, dur){
  const full = el.getAttribute("data-full"), o = {n:0};
  return gsap.fromTo(o, {n:0}, {n:full.length, duration:dur, ease:"none", onUpdate:() => { el.textContent = full.slice(0, Math.round(o.n)); }});
}
function prepDraw(p){ const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; return L; }
const draw = (p, d) => gsap.fromTo(p, {strokeDashoffset:p.getTotalLength()}, {strokeDashoffset:0, duration:d, ease:"power2.out"});
const along = (dot, path, d) => { const L = path.getTotalLength(), o = {t:0};
  return gsap.fromTo(o, {t:0}, {t:1, duration:d, ease:"power2.inOut", onUpdate:() => { const p = path.getPointAtLength(o.t * L); dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y); }}); };

/* subrayado de «evidencia técnica real» */
const sub = $("#sub"); sub.textContent = sub.getAttribute("data-full");
const KEY = "evidencia técnica real", iK = sub.textContent.indexOf(KEY);
const ux = sub.getStartPositionOfChar(iK).x, uw = sub.getSubStringLength(iK, KEY.length);
$("#subline").setAttribute("x", ux); sub.textContent = "";

/* ---------- estado inicial */
applyCam();
const lids = $$("#introEye path"); lids.forEach(prepDraw);
$$(".drop, .narr").forEach(prepDraw);
gsap.set("#introGlow", {scale:0, svgOrigin:"800 360"});
gsap.set("#introEye", {opacity:0});
gsap.set("#introEye .pupil", {scale:0, transformOrigin:"50% 50%"});
gsap.set(["#chip", "#camp", "#cred", "#pie", "#src", ".drop"], {opacity:0});
gsap.set("#chip", {x:-60});
gsap.set("#camp", {y:-40});
gsap.set(".node", {scale:0, transformOrigin:"50% 50%"});
gsap.set(".card", {opacity:0, y:-50});
gsap.set(".ichk", {scale:0, transformOrigin:"50% 50%"});
gsap.set(".ibar", {scaleX:0, transformOrigin:"0% 50%"});
gsap.set(".rhi", {opacity:0});
gsap.set(".dl", {opacity:1}); $$(".dl").forEach(prepDraw);
gsap.set("#stamp", {opacity:0, scale:2.2, rotation:-8, transformOrigin:"50% 50%"});
gsap.set(".pen", {opacity:0});
gsap.set("#cred", {y:60});
gsap.set(["#pills", "#badge", "#lock", "#seal", ".ver", ".vline"], {opacity:0});
gsap.set("#badge", {scale:.3, transformOrigin:"50% 50%"});
gsap.set(".vchk", {scale:0, transformOrigin:"50% 50%"});
gsap.set(".ver", {y:30});
prepDraw($("#seal"));

/* plan: barras desordenadas que se ordenan */
const PB = $$(".pbar"), SH = [36, 36, -72];   // orden inicial: media, baja, alta
PB.forEach((b, k) => gsap.set(b, {y:SH[k]}));

/* ---------- línea de tiempo (ritmo de anuncio, ~31 s) */
const tl = gsap.timeline({paused:true, defaults:{ease:"power3.out"}});
// 1 · Apertura
tl.addLabel("s1")
  .to("#introEye", {opacity:1, duration:.25}, "s1")
  .to("#introGlow", {scale:1, duration:.8, ease:"expo.out"}, "s1")
  .add(lids.map((p, i) => draw(p, .55).delay(i * .12)), "s1+=.1")
  .to("#introEye .pupil", {scale:1, duration:.45, ease:"back.out(3)"}, "s1+=.75")
  .add(tw($("#introT"), 1.3), "s1+=.9")
  .to({}, {duration:.5});
// 2 · La campaña
tl.addLabel("s2")
  .add(camTo(800, 330, 1.08, .9), "s2")
  .to("#intro", {y:-120, opacity:0, duration:.6, ease:"power2.in"}, "s2")
  .to("#chip", {x:0, opacity:1, duration:.5, ease:"back.out(2)"}, "s2+=.4")
  .add(tw($("#title"), .9), "s2+=.5")
  .add(tw($("#sub"), 1), "s2+=1.3")
  .to("#subline", {attr:{width:uw}, duration:.45, ease:"power2.inOut"}, "s2+=2.3")
  .to("#camp", {y:0, opacity:1, duration:.6, ease:"expo.out"}, "s2+=1.6")
  .add(tw($("#campT"), 1), "s2+=2.2")
  .to("#n0", {scale:1, duration:.4, ease:"back.out(2.4)"}, "s2+=2.2")
  .add(draw($$(".narr")[0], .35), "s2+=2.55")
  .to("#n1", {scale:1, duration:.4, ease:"back.out(2.4)"}, "s2+=2.8")
  .add(draw($$(".narr")[1], .35), "s2+=3.15")
  .to("#n2", {scale:1, duration:.4, ease:"back.out(2.4)"}, "s2+=3.4")
  .to({}, {duration:.4});
// 3 · Informe y plan
function dropCard(i, at){
  const d = $$(".drop")[i], c = $("#c" + i);
  tl.set(d, {opacity:1}, at).add(draw(d, .3), at)
    .to(c, {y:0, opacity:1, duration:.5, ease:"back.out(2)"}, `${at}+.2`)
    .to(c.querySelector(".cglow"), {opacity:1, duration:.15}, `${at}+.4`)
    .to(c.querySelector(".cglow"), {opacity:0, duration:.5}, `${at}+.8`);
}
tl.addLabel("s3").add(camTo(432, 440, 1.5, .9), "s3");
dropCard(0, "s3+=.3"); dropCard(1, "s3+=.7");
$$("#il0 .ibar").forEach((b, k) => tl.to(b, {scaleX:1, duration:.35}, `s3+=${1.3 + k*.3}`));
$$("#il0 .ichk").forEach((b, k) => tl.to(b, {scale:1, duration:.3, ease:"back.out(3)"}, `s3+=${1.45 + k*.3}`));
tl.to(PB[2], {y:0, duration:.6, ease:"power2.inOut"}, "s3+=2.6")
  .to([PB[0], PB[1]], {y:0, duration:.6, ease:"power2.inOut"}, "s3+=2.6")
  .to({}, {duration:.6});
// 4 · RoPA y DPIA
tl.addLabel("s4").add(camTo(1168, 440, 1.5, .9), "s4");
dropCard(2, "s4+=.3"); dropCard(3, "s4+=.7");
tl.fromTo("#il2 .rr", {x:-156, opacity:.5}, {x:0, opacity:1, duration:.7, ease:"power2.inOut"}, "s4+=1.3")
  .to("#il2 .rdiff", {fill:"#E8A39C", duration:.25}, "s4+=2.0")
  .to("#il2 .rhi", {opacity:1, duration:.2, stagger:.15}, "s4+=2.0")
  .to("#il2 .rhi", {opacity:.35, duration:.18, yoyo:true, repeat:3}, "s4+=2.35")
  .to(".pen", {opacity:1, duration:.2}, "s4+=1.3")
  .add($$(".dl").map((p, k) => draw(p, .3).delay(k * .25)), "s4+=1.4")
  .fromTo(".pen", {x:-90, y:-48}, {x:0, y:0, duration:1.2, ease:"none"}, "s4+=1.4")
  .to("#stamp", {opacity:1, scale:1, duration:.35, ease:"power4.in"}, "s4+=2.7")
  .fromTo("#c3", {x:0}, {x:4, duration:.05, yoyo:true, repeat:3}, "s4+=3.05")
  .to({}, {duration:.6});
// 5 · La credencial
tl.addLabel("s5")
  .add(camTo(800, 600, 1.05, 1), "s5")
  .to("#cred", {y:0, opacity:1, duration:.6, ease:"expo.out"}, "s5+=.3")
  .add(tw($("#credT"), .6), "s5+=.8")
  .to("#pills", {opacity:1, duration:.3}, "s5+=1.4")
  .fromTo(".pill", {scale:.5, transformOrigin:"50% 50%"}, {scale:1, duration:.4, stagger:.12, ease:"back.out(3)"}, "s5+=1.4");
$$(".rdot").forEach((d, i) => {
  tl.set(d, {opacity:1}, `s5+=${1.2 + i*.15}`).add(along(d, $$(".route")[i], 1.1), `s5+=${1.2 + i*.15}`)
    .to(d, {opacity:0, duration:.15}, `s5+=${2.25 + i*.15}`);
});
tl.fromTo("#fpG", {scale:1, transformOrigin:"50% 50%"}, {scale:1.22, duration:.25, yoyo:true, repeat:1}, "s5+=2.6")
  .add(tw($("#cr1"), 1.1), "s5+=2.4")
  .set("#seal", {opacity:1}, "s5+=3.0").add(draw($("#seal"), .8), "s5+=3.0")
  .to("#badge", {opacity:1, scale:1, duration:.5, ease:"back.out(3)"}, "s5+=3.7")
  .to({}, {duration:.6});
// 6 · La comprueba un tercero
tl.addLabel("s6")
  .add(camTo(820, 690, 1.06, .9), "s6")
  .add(tw($("#cr2"), 1.1), "s6+=.4")
  .add(tw($("#cr3"), 1), "s6+=1.5")
  .to(".ver", {opacity:1, y:0, duration:.45, stagger:.15, ease:"back.out(2)"}, "s6+=.5")
  .to(".vline", {opacity:1, duration:.3, stagger:.2}, "s6+=1.3")
  .fromTo(".vline", {strokeDashoffset:0}, {strokeDashoffset:-48, duration:1.6, ease:"none"}, "s6+=1.3")
  .to("#lock", {opacity:1, duration:.2}, "s6+=1.5")
  .fromTo("#lock", {scale:.3, transformOrigin:"50% 50%"}, {scale:1, duration:.4, ease:"back.out(3)"}, "s6+=1.5")
  .to(".vchk", {scale:1, duration:.3, stagger:.25, ease:"back.out(3)"}, "s6+=2.3")
  .to({}, {duration:.7});
// 7 · Cierre
tl.addLabel("s7")
  .add(camTo(800, 450, 1, 1), "s7")
  .add(tw($("#moral"), 1.4), "s7+=.6")
  .to(["#pie", "#src"], {opacity:1, duration:.5}, "s7+=.8")
  .addLabel("full", "s7+=2.2")
  .to("#outro", {opacity:1, duration:.6}, "s7+=2.8")
  .fromTo("#outEye", {scale:.6, transformOrigin:"50% 50%"}, {scale:1, duration:.6, ease:"back.out(2)"}, "s7+=2.8")
  .to({}, {duration:1.8})
  .to("#outro", {opacity:0, duration:.6})
  .addLabel("end");

/* ---------- controles */
const labels = SCENES.map((_, i) => tl.labels["s" + (i + 1)]).concat(tl.labels.end);
const sc = $("#scenes");
SCENES.forEach((n, i) => { const b = document.createElement("button"); b.innerHTML = `<b>${i + 1}</b><span>${n}</span><i></i>`; b.title = `${i + 1} · ${n}`; b.onclick = () => go(i); sc.appendChild(b); });
const sbtn = $$(".scenes button");
const cur = () => { const t = tl.time(); let k = 0; labels.forEach((l, i) => { if(i < SCENES.length && t >= l - .001) k = i; }); return k; };
let seg = null;
function paint(){
  const t = tl.time(), k = cur();
  sbtn.forEach((b, i) => { b.classList.toggle("on", i === k); const a = labels[i], z = labels[i + 1]; b.querySelector("i").style.width = (t >= z ? 100 : t <= a ? 0 : (t - a) / (z - a) * 100) + "%"; });
  $("#pi").setAttribute("d", tl.isActive() || (seg && seg.isActive()) ? "M7 5h4v14H7zM13 5h4v14h-4z" : "M8 5v14l11-7z");
  document.body.classList.toggle("at-start", t < .01);
}
gsap.ticker.add(paint);
function stopSeg(){ if(seg){ seg.kill(); seg = null; } }
function go(i){
  stopSeg(); tl.pause(); i = Math.max(0, Math.min(SCENES.length - 1, i));
  tl.seek(labels[i], false);
  if(WEB){ tl.play(); return; }
  seg = tl.tweenFromTo(labels[i], labels[i + 1], {ease:"none"});
}
function next(){
  if(seg && seg.isActive()){ const k = cur(); stopSeg(); tl.seek(labels[k + 1], false); return; }
  const t = tl.time(), k = cur();
  if(t >= labels[SCENES.length] - .01) return;
  go(t - labels[k] < .02 ? k : k + 1);
}
function prev(){
  if(seg && seg.isActive()){ go(cur()); return; }
  const t = tl.time(), k = cur();
  go(t - labels[k] < .02 ? k - 1 : k);
}
function toggle(){
  if(WEB){ if(tl.time() >= tl.duration() - .01){ go(0); return; } tl.paused() ? tl.play() : tl.pause(); return; }
  if(seg && seg.isActive()){ seg.pause(); return; }
  if(seg && seg.paused() && seg.progress() < 1){ seg.resume(); return; }
  next();
}
$("#play").onclick = toggle; $("#next").onclick = next; $("#prev").onclick = prev;
$("#replay").onclick = () => go(0);
const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
$("#fs").onclick = fs;
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if(["ArrowRight", "PageDown", " "].includes(e.key)){ e.preventDefault(); next(); }
  else if(["ArrowLeft", "PageUp"].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key === "f" || e.key === "F") fs();
  else if(e.key === "h" || e.key === "H") document.body.classList.toggle("ui-off");
  else if(e.key === "Home") go(0);
  else if(/^[1-7]$/.test(e.key)) go(+e.key - 1);
});
if(!WEB) $("#wrap").addEventListener("click", next);

/* modo web: arranca al verse; movimiento reducido: diagrama completo */
if(reduced){
  document.body.classList.add("reduced");
  tl.seek(tl.labels.full, false);
  $("#rm-play").onclick = () => { document.body.classList.remove("reduced"); go(0); if(!WEB) tl.play(); };
} else if(WEB){
  const io = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting && tl.time() === 0) tl.play(); else if(!en.isIntersecting) tl.pause(); }), {threshold:.4});
  io.observe($("#stage"));
}
let idleT; document.addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if(document.fullscreenElement) document.body.classList.add("idle"); }, 2500); });
window.D04 = {tl, go};
})();
</script>
